$schema: "http://json-schema.org/draft-07/schema#"
title: InfraOps Infrastructure
description: Single source of truth for infrastructure layout
type: object
additionalProperties: false
required:
  - name

properties:
  name:
    type: string
    minLength: 1
    description: Infrastructure name

  platform:
    type: object
    description: Platform-specific configuration
    additionalProperties: false
    properties:
      admin:
        type: object
        description: Administrative access configuration
        additionalProperties: false
        properties:
          user:
            type: string
            minLength: 1
            description: SSH username for administrative access
          group:
            type: string
            minLength: 1
            description: Unix group for administrative users
      keycloak:
        type: object
        description: Keycloak identity provider configuration
        additionalProperties: false
        properties:
          realm:
            type: string
            default: infraops
            description: Keycloak realm name for this infrastructure
          auth_realm:
            type: string
            default: master
            description: Keycloak realm used for authentication
          admin_user:
            type: string
            default: admin
            description: Keycloak administrator username
          container_image:
            type: string
            minLength: 1
            description: Keycloak container image reference
      kubernetes:
        type: object
        description: Kubernetes cluster defaults
        additionalProperties: false
        properties:
          version:
            type: string
            pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
            description: Kubernetes version to install
          pod_network_cidr:
            type: string
            pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
            description: CIDR range for pod networking
          calico_version:
            type: string
            pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
            description: Calico CNI plugin version
          oidc_issuer_url:
            type: string
            format: uri
            description: OIDC issuer URL for cluster authentication
      terraform:
        type: object
        description: Terraform version configuration
        additionalProperties: false
        properties:
          version:
            type: string
            pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
            description: Terraform version constraint
      proxmox:
        type: object
        description: Proxmox VE host configuration
        additionalProperties: false
        properties:
          node:
            type: string
            minLength: 1
            description: Proxmox node name for VM placement
          template_id:
            type: integer
            minimum: 100
            description: Proxmox template VM ID to clone from
          dns_servers:
            type: array
            items:
              type: string
            description: DNS server IPs assigned to VMs
          dns_domain:
            type: string
            minLength: 1
            description: DNS domain suffix assigned to VMs
          linked_clone:
            type: boolean
            default: false
            description: Use linked clones for faster creation
          tls_self_signed:
            type: boolean
            default: false
            description: Proxmox API uses a self-signed TLS certificate

  defaults:
    type: object
    description: Default values applied to all clusters and VMs
    additionalProperties: false
    properties:
      cluster_type:
        type: string
        enum: [k8s, nomad, swarm, ecs]
        default: k8s
        description: Default cluster type for all clusters
      service_type:
        type: string
        enum: [docker_compose, helm, systemd, nomad_job, ecs_service]
        default: docker_compose
        description: Default service deployment method
      service_host:
        type: string
        minLength: 1
        description: Default host for running services
      gateway:
        type: string
        pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$"
        description: Network gateway IP for static-configured VMs
      vm:
        type: object
        description: Default VM resource configuration
        additionalProperties: false
        properties:
          cores:
            type: integer
            minimum: 1
            default: 2
            description: Default CPU cores per VM
          memory_gb:
            type: integer
            minimum: 1
            default: 4
            description: Default memory in GB per VM
          disk_gb:
            type: integer
            minimum: 1
            default: 32
            description: Default disk size in GB per VM
          datastore:
            type: string
            default: "local-lvm"
            description: Default Proxmox datastore for VM disks
      planes:
        type: object
        description: Default naming for node planes
        additionalProperties: false
        required:
          - control_plane
          - workers
        properties:
          control_plane:
            type: object
            description: Default configuration for control plane nodes
            additionalProperties: false
            required:
              - plane_name
            properties:
              plane_name:
                type: string
                pattern: "^[a-z][a-z0-9_-]*$"
                default: control
                description: Naming prefix for control plane nodes
          workers:
            type: object
            description: Default configuration for worker nodes
            additionalProperties: false
            required:
              - plane_name
            properties:
              plane_name:
                type: string
                pattern: "^[a-z][a-z0-9_-]*$"
                default: worker
                description: Naming prefix for worker nodes

  clusters:
    type: array
    minItems: 1
    description: Kubernetes cluster definitions
    items:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          description: Cluster name (used in resource naming and DNS)
        oidc_issuer_url:
          type: string
          format: uri
          description: OIDC issuer URL override for this cluster
        enforcement:
          type: array
          items:
            type: string
            enum: [infrastructure_provisioning, configuration_management]
          default: [infrastructure_provisioning, configuration_management]
          description: Enforcement policies for this cluster
        cluster_type:
          type: string
          enum: [k8s, nomad, swarm, ecs]
          description: Cluster type override
        drawio_icon:
          type: string
          default: "mxgraph.kubernetes.kubernetes_cluster"
          description: Draw.io icon for cluster visualization
        plane_defaults:
          type: object
          description: Per-plane resource overrides for this cluster
          additionalProperties: false
          properties:
            control_plane:
              type: object
              description: Control plane defaults for this cluster
              additionalProperties: false
              properties:
                plane_name:
                  type: string
                  pattern: "^[a-z][a-z0-9_-]*$"
                  description: Control plane naming override
                memory_gb:
                  type: integer
                  minimum: 1
                  description: Control plane memory override
                cores:
                  type: integer
                  minimum: 1
                  description: Control plane CPU override
                disk_gb:
                  type: integer
                  minimum: 1
                  description: Control plane disk override
            workers:
              type: object
              description: Worker defaults for this cluster
              additionalProperties: false
              properties:
                plane_name:
                  type: string
                  pattern: "^[a-z][a-z0-9_-]*$"
                  description: Worker naming override
                memory_gb:
                  type: integer
                  minimum: 1
                  description: Worker memory override
                cores:
                  type: integer
                  minimum: 1
                  description: Worker CPU override
                disk_gb:
                  type: integer
                  minimum: 1
                  description: Worker disk override
        control_plane:
          type: object
          description: Control plane node configuration
          additionalProperties: false
          required:
            - nodes
          properties:
            nodes:
              type: integer
              minimum: 1
              description: Number of control plane nodes (1, 3, or 5)
            vip:
              type: string
              pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$"
              description: Virtual IP for k8s API endpoint (keepalived)
            vm_id_start:
              type: integer
              minimum: 100
              description: Start of VM ID range for control plane
            vm_id_end:
              type: integer
              minimum: 100
              description: End of VM ID range for control plane
            drawio_icon:
              type: string
              default: "mxgraph.kubernetes.master"
              description: Draw.io icon for control plane nodes
            memory_gb:
              type: integer
              minimum: 1
              description: Control plane memory override
            cores:
              type: integer
              minimum: 1
              description: Control plane CPU override
            disk_gb:
              type: integer
              minimum: 1
              description: Control plane disk override
            datastore:
              type: string
              description: Control plane datastore override
        workers:
          type: object
          description: Worker node configuration
          additionalProperties: false
          required:
            - nodes
          properties:
            nodes:
              type: integer
              minimum: 1
              description: Number of worker nodes
            vm_id_start:
              type: integer
              minimum: 100
              description: Start of VM ID range for workers
            vm_id_end:
              type: integer
              minimum: 100
              description: End of VM ID range for workers
            drawio_icon:
              type: string
              default: "mxgraph.kubernetes.node"
              description: Draw.io icon for worker nodes
            memory_gb:
              type: integer
              minimum: 1
              description: Worker memory override
            cores:
              type: integer
              minimum: 1
              description: Worker CPU override
            disk_gb:
              type: integer
              minimum: 1
              description: Worker disk override
            datastore:
              type: string
              description: Worker datastore override

  hosts:
    type: array
    description: Standalone host definitions (not part of a cluster)
    items:
      type: object
      additionalProperties: false
      required:
        - name
        - enforcement
        - connection
      properties:
        name:
          type: string
          minLength: 1
          description: Hostname (unique identifier)
        services:
          type: array
          items:
            type: string
            enum:
              - dns
              - dhcp
              - gateway
              - firewall
              - ntp
              - proxy
              - vpn
              - storage
              - monitoring
          description: Services this host provides
        ip_pool:
          type: object
          description: IAC-managed IP range for DNS automation
          additionalProperties: false
          properties:
            start:
              type: string
              pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$"
              description: Start of IAC-managed IP range
            end:
              type: string
              pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$"
              description: End of IAC-managed IP range
        enforcement:
          type: array
          items:
            type: string
            enum: [infrastructure_provisioning, configuration_management]
          description: Enforcement policies for this host
        connection:
          type: object
          description: SSH connection details
          additionalProperties: false
          required:
            - host
            - user
          properties:
            host:
              type: string
              minLength: 1
              description: SSH connection hostname or IP
            user:
              type: string
              minLength: 1
              description: SSH connection username

  services:
    type: object
    description: Service instance definitions with host placement
    additionalProperties: false
    required:
      - defaults
      - instances
    properties:
      defaults:
        type: object
        description: Default settings for service instances
        additionalProperties: false
        required:
          - host
        properties:
          host:
            type: string
            minLength: 1
            description: Default host for running service instances
      instances:
        type: object
        description: Service instance definitions grouped by service name
        minProperties: 1
        additionalProperties: false
        patternProperties:
          "^[a-z][a-z0-9_-]*$":
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Service instance name
                drawio_icon:
                  type: string
                  default: "mxgraph.docker.compose_service"
                  description: Draw.io icon for service visualization
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: Service port number
                service_type:
                  type: string
                  enum: [docker_compose, helm, systemd, nomad_job, ecs_service]
                  description: Service deployment method override
