---
# DNS host override management for IAC pool.
#
# Actions:
#   add:name1,name2    — add host overrides (short names default to localdomain)
#   delete:name1,name2 — delete host overrides
#   list               — list hosts in pool
#
# Delimiters — colon separates action from targets, commas separate targets.
# Steps are separated by one of:
#   | (pipe)     — use with -e inline:  -e "workflow=add:a,b|list|delete:a|list"
#   \n (newline) — use with @file:      -e "@workflow.txt"  (one step per line)
#   (space)      — use with @file:      -e "@workflow.txt"  (steps separated by spaces)
#
# IMPORTANT: Spaces cannot be used with -e inline because Ansible splits
# extra-vars on spaces. For multi-step inline, always use pipe (|).
# Newlines cannot be used with -e inline either (shell strips them).
# Both spaces and newlines work with @file because the entire file content
# is passed as a single variable value.
#
# Examples:
#   VAULT_TOKEN=hvs.xxx ansible-playbook manage-iac-dns.yaml \
#     -e "workflow=list"
#
#   VAULT_TOKEN=hvs.xxx ansible-playbook manage-iac-dns.yaml \
#     -e "workflow=add:server01,server02|list|delete:server01|list"
#
#   # workflow.txt: add:server01,server02 list delete:server01 list
#   VAULT_TOKEN=hvs.xxx ansible-playbook manage-iac-dns.yaml -e "@workflow.txt"
#
# Clean output — use JSON callback + jq to get plain host list:
#   ANSIBLE_STDOUT_CALLBACK=json ansible-playbook manage-iac-dns.yaml \
#     -e "workflow=list" 2>/dev/null | \
#     jq -r '.plays[].tasks[] | select(.task.name == "List — display pool hosts") | .hosts.localhost | select(.skipped != true) | .msg[]'

- name: Setup — read infrastructure and get API key
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Validate workflow parameter
      ansible.builtin.assert:
        that: workflow is defined and workflow | length > 0
        fail_msg: "workflow parameter is required. Example: -e \"workflow=add:myhost|list\""

    - name: Parse workflow into steps
      ansible.builtin.set_fact:
        wf_raw: >-
          {% set ns = namespace(steps=[]) %}
          {% set normalized = workflow | replace('\n', '|') | replace(' ', '|') %}
          {% for raw_step in normalized | split('|') %}
          {% set raw_step = raw_step.strip() %}
          {% if raw_step %}
          {% set parts = raw_step.split(':', 1) %}
          {% set action = parts[0] %}
          {% set targets = [] %}
          {% if parts | length > 1 and parts[1] %}
          {% for t in parts[1].split(',') %}
          {% set dp = t.split('.') %}
          {% set _ = targets.append({'hostname': dp[0], 'domain': (dp[1:] | join('.') if dp | length > 1 else 'localdomain')}) %}
          {% endfor %}
          {% endif %}
          {% set ns.steps = ns.steps + [{'action': action, 'targets': targets}] %}
          {% endif %}
          {% endfor %}
          {{ ns.steps | to_json }}

    - name: Set parsed workflow steps
      ansible.builtin.set_fact:
        workflow_steps: "{{ wf_raw | trim | from_json }}"

    - name: Validate all actions
      ansible.builtin.assert:
        that: item.action in ['add', 'delete', 'list']
        fail_msg: "Invalid action '{{ item.action }}'. Must be add, delete, or list"
      loop: "{{ workflow_steps }}"
      loop_control:
        label: "{{ item.action }}"

    - name: Read infrastructure.yaml
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../../config/infrastructure.yaml"
      register: infra_raw

    - name: Parse infrastructure.yaml
      ansible.builtin.set_fact:
        infra: "{{ infra_raw.content | b64decode | from_yaml }}"

    - name: Find DNS server entry
      ansible.builtin.set_fact:
        dns_entry: "{{ infra.hosts | selectattr('services', 'defined') | selectattr('services', 'contains', 'dns') | first }}"

    - name: Set pfSense API connection vars
      ansible.builtin.set_fact:
        pfsense_host: "{{ dns_entry.connection.host }}"
        ip_pool: "{{ dns_entry.ip_pool }}"

    - name: Generate IP pool list
      ansible.builtin.set_fact:
        ip_list: "{{ range(ip_pool.start.split('.')[-1] | int, ip_pool.end.split('.')[-1] | int + 1) | map('string') | map('regex_replace', '^(.*)', ip_base ~ '.\\1') | list }}"
      vars:
        ip_base: "{{ ip_pool.start.split('.')[:3] | join('.') }}"

    - name: Find docker host entry
      ansible.builtin.set_fact:
        docker_host: "{{ infra.hosts | selectattr('name', 'equalto', 'docker') | first }}"

    - name: Find vault service port
      ansible.builtin.set_fact:
        vault_port: "{{ (infra.services.instances.vault | first).port }}"

    - name: Set vault URL
      ansible.builtin.set_fact:
        vault_url: "https://{{ docker_host.connection.host }}:{{ vault_port }}"

    - name: Get pfSense API key from Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_url }}"
        path: infraops/pfsense
        validate_certs: false
      register: vault_pfsense

    - name: Set pfSense API key
      ansible.builtin.set_fact:
        pfsense_api_key: "{{ vault_pfsense.secret.api_key }}"

- name: Manage DNS host overrides
  hosts: localhost
  gather_facts: no
  vars:
    pfsense_api_key: "{{ hostvars['localhost']['pfsense_api_key'] }}"
    pfsense_host: "{{ hostvars['localhost']['pfsense_host'] }}"
    ip_pool: "{{ hostvars['localhost']['ip_pool'] }}"
    ip_list: "{{ hostvars['localhost']['ip_list'] }}"
    workflow_steps: "{{ hostvars['localhost']['workflow_steps'] }}"
  tasks:
    - name: Retrieve all DNS Resolver Host Overrides
      pfrest.pfsense.services_dns_resolver_host_overrides_info:
        api_host: "{{ pfsense_host }}"
        api_key: "{{ pfsense_api_key }}"
        api_protocol: https
        validate_certs: false
      register: dns_result

    - name: Set host overrides fact
      ansible.builtin.set_fact:
        all_overrides: "{{ dns_result.data }}"

    - name: Filter overrides to IAC pool only
      ansible.builtin.set_fact:
        pool_overrides: "{{ all_overrides | selectattr('ip', 'defined') | selectattr('ip.0', 'in', ip_list) | list }}"

    - name: Sort pool overrides by IP
      ansible.builtin.set_fact:
        pool_overrides: "{{ pool_overrides | sort(attribute='ip') }}"

    - name: Execute workflow steps
      ansible.builtin.include_tasks: tasks/run-step.yaml
      loop: "{{ workflow_steps }}"
      loop_control:
        loop_var: step
        label: "{{ step.action }}{% if step.targets | length > 0 %}:{{ step.targets | map(attribute='hostname') | join(',') }}{% endif %}"
