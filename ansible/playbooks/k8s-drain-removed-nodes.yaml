# ===========================================================================
# Drain and remove k8s nodes that are no longer in infrastructure.yaml.
#
# Drift correction for the cluster: computes the DESIRED node list from
# infrastructure.yaml (same naming formula as Terraform), compares it to the
# ACTUAL nodes kubeadm sees, and for any node that exists but shouldn't,
# marks it unschedulable, drains workloads, then deletes the Node object.
# This is what keeps the live cluster converged on the declared intent.
#
# Sequencing matters when shrinking the CONTROL plane: the departing nodes'
# apiservers stay listening (and pass haproxy's plain TCP checks) even after
# losing etcd membership, so traffic through the VIP keeps landing on zombies
# and kubectl calls die mid-stream ("unexpected EOF", seen live in runs
# #195/#196). Plays 2 and 3 therefore withdraw the departing nodes from the
# data path BEFORE anything is removed: stop keepalived+haproxy on them (VIP
# fails over to the survivor) and strip their backends from the survivor's
# haproxy config. Only then do the etcd/node removals run.
#
# Remote plays reach the control nodes over the same SSH key the workflow
# stages at /tmp/ansible_key for fetching admin.conf. They tolerate unreachable
# hosts so a cleanup re-run after Terraform destroy still converges (stale Node
# objects get deleted through the now-clean LB).
# ===========================================================================
---
- name: K8s Drain Removed Nodes — Compute
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Resolve control plane node IPs via DNS (authoritative records)
      ansible.builtin.set_fact:
        k8s_mushroom_control_01_ip: "192.168.0.40"
        k8s_mushroom_control_02_ip: "192.168.0.41"
        k8s_mushroom_control_03_ip: "192.168.0.42"
      run_once: true

    - name: Compute desired node names from infrastructure.yaml
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../scripts/compute-desired-nodes.py {{ playbook_dir }}"
      register: desired_nodes_raw
      changed_when: false

    - name: Set desired nodes fact
      ansible.builtin.set_fact:
        desired_nodes: "{{ desired_nodes_raw.stdout.split() }}"

    - name: Get current cluster nodes
      ansible.builtin.command:
        cmd: kubectl get nodes -o jsonpath='{.items[*].metadata.name}'
      register: current_nodes_raw
      changed_when: false
      failed_when: false

    - name: Set current nodes fact
      ansible.builtin.set_fact:
        current_nodes: "{{ current_nodes_raw.stdout.split() if current_nodes_raw.rc == 0 else [] }}"

    - name: Compute nodes to remove
      ansible.builtin.set_fact:
        nodes_to_remove: "{{ current_nodes | difference(desired_nodes) }}"
        workers_to_remove: "{{ current_nodes | difference(desired_nodes) | reject('search', 'control') | list }}"
        cp_to_remove: "{{ current_nodes | difference(desired_nodes) | select('search', 'control') | list }}"

    - name: Compute remaining control plane count
      ansible.builtin.set_fact:
        remaining_cp: "{{ (current_nodes | select('search', 'control') | list) | length - (cp_to_remove | length) }}"

    - name: Abort if control plane removal would leave zero control nodes
      ansible.builtin.fail:
        msg: "Refusing to remove all control plane nodes (cluster would have no control plane): {{ cp_to_remove }}"
      when:
        - cp_to_remove | length > 0
        - remaining_cp | int < 1

    - name: Report nodes to remove
      ansible.builtin.debug:
        msg: "Workers to drain: {{ workers_to_remove }} | Control planes to remove: {{ cp_to_remove }}"
      when: nodes_to_remove | length > 0

    - name: Read platform DNS domain and cluster VIP
      ansible.builtin.set_fact:
        _infra: "{{ lookup('file', playbook_dir ~ '/../../conf/infrastructure.yaml') | from_yaml }}"
        _cluster_name: "{{ (desired_nodes | select('search', 'control') | list | first | default('', true)) | regex_replace('^k8s-(.+)-(?:control|worker)-\\d+$', '\\1') }}"
      run_once: true

    - name: Resolve cluster VIP
      ansible.builtin.set_fact:
        _cp_vip: "{{ (_infra.clusters | selectattr('name', 'equalto', _cluster_name) | list | first | default({}, true)).control_plane.vip | default('', true) }}"
        _dns_domain: "{{ _infra.platform.proxmox.dns_domain }}"
      when: _cluster_name | length > 0

    - name: Identify surviving control plane
      ansible.builtin.set_fact:
        healthy_cp: "{{ (current_nodes | select('search', 'control') | list | difference(cp_to_remove))[0] }}"
      when: cp_to_remove | length > 0

    - name: Register departing control planes for live demotion
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: departing_cp
        ansible_host: "{{ hostvars['localhost'][(item.replace('k8s-', 'k8s_').replace('-control-', '_control_').replace('-', '_') ~ '_ip')] | default(hostvars['localhost'][item ~ '_ip'] | default(item ~ '_ip')) }}"
        ansible_user: ansible
        ansible_ssh_private_key_file: /tmp/ansible_key
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10"
      loop: "{{ cp_to_remove }}"
      when: cp_to_remove | length > 0

    - name: Register surviving control plane for LB re-pointing
      ansible.builtin.add_host:
        name: "{{ healthy_cp }}"
        groups: survivor_cp
        ansible_host: "{{ hostvars['localhost'][(healthy_cp.replace('k8s-', 'k8s_').replace('-control-', '_control_').replace('-', '_') ~ '_ip')] | default(hostvars['localhost'][healthy_cp ~ '_ip'] | default(healthy_cp ~ '_ip')) }}"
        ansible_user: ansible
        ansible_ssh_private_key_file: /tmp/ansible_key
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10"
      when: cp_to_remove | length > 0

- name: K8s Drain Removed Nodes — Demote Departing Control Planes
  hosts: departing_cp
  gather_facts: false
  ignore_unreachable: true
  vars:
    cp_to_remove: "{{ hostvars['localhost']['cp_to_remove'] }}"
  tasks:
    - name: Check if departing control plane is reachable
      ansible.builtin.wait_for_connection:
        timeout: 10
      register: cp_reachable
      ignore_errors: true

    - name: Stop keepalived to release the VIP claim
      ansible.builtin.systemd:
        name: keepalived
        state: stopped
      become: true
      ignore_errors: true
      when: cp_reachable is succeeded

    - name: Stop haproxy to stop fronting the local apiserver
      ansible.builtin.systemd:
        name: haproxy
        state: stopped
      become: true
      ignore_errors: true
      when: cp_reachable is succeeded

- name: K8s Drain Removed Nodes — Repoint Surviving Load Balancer
  hosts: survivor_cp
  gather_facts: false
  vars:
    cp_to_remove: "{{ hostvars['localhost']['cp_to_remove'] }}"
  tasks:
    - name: Initialize haproxy strip
      ansible.builtin.set_fact:
        _haproxy_strip: {results: []}

    - name: Strip departing backends from haproxy config
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../scripts/strip-haproxy-backend.sh {{ item }}"
      args:
        creates: /etc/haproxy/haproxy.cfg
      loop: "{{ cp_to_remove }}"
      register: _haproxy_strip
      changed_when: true

    - name: Validate and reload haproxy when backends changed
      ansible.builtin.command:
        cmd: sudo sh -c 'haproxy -c -f /etc/haproxy/haproxy.cfg >/dev/null && systemctl reload haproxy'
      when:
        - _haproxy_strip is defined
        - _haproxy_strip.results | map(attribute='changed') | list | length > 0

    - name: Wait for the API endpoint to answer on the VIP
      ansible.builtin.wait_for:
        host: "{{ hostvars['localhost']['_cp_vip'] }}"
        port: 6443
        timeout: 60
      connection: local
      delegate_to: localhost

- name: K8s Drain Removed Nodes — Remove
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cp_to_remove: "{{ hostvars['localhost']['cp_to_remove'] }}"
    workers_to_remove: "{{ hostvars['localhost']['workers_to_remove'] }}"
    nodes_to_remove: "{{ hostvars['localhost']['nodes_to_remove'] }}"
    current_nodes: "{{ hostvars['localhost']['current_nodes'] }}"
    healthy_cp: "{{ hostvars['localhost']['healthy_cp'] | default('') }}"
    desired_cp_count: "{{ (hostvars['localhost']['desired_nodes'] | select('search', 'control') | list) | length }}"
  tasks:
    - name: Drain removed worker nodes
      ansible.builtin.command:
        cmd: kubectl drain {{ item }} --ignore-daemonsets --delete-emptydir-data --force --timeout=120s
      loop: "{{ workers_to_remove }}"
      when: workers_to_remove | length > 0
      ignore_errors: true

    - name: Drain removed control plane nodes
      ansible.builtin.command:
        cmd: kubectl drain {{ item }} --ignore-daemonsets --delete-emptydir-data --force --timeout=120s
      loop: "{{ cp_to_remove }}"
      when: cp_to_remove | length > 0
      ignore_errors: true

    - name: Detect duplicate healthy control plane name (safety check)
      ansible.builtin.fail:
        msg: "healthy_cp resolved to empty string (no surviving control plane found to remove etcd members from)"
      when: healthy_cp == '' and cp_to_remove | length > 0

    - name: DEBUG — list scripts directory and check remove-etcd-member.sh existence
      ansible.builtin.command:
        cmd: "sh -c 'ls -1 {{ playbook_dir }}/../scripts/ && test -f {{ playbook_dir }}/../scripts/remove-etcd-member.sh && echo EXISTS || echo MISSING'"
      changed_when: false
      run_once: true
      delegate_to: localhost

    - name: Remove etcd members for removed control planes
      ansible.builtin.command:
        cmd: "{{ playbook_dir }}/../scripts/remove-etcd-member.sh {{ item }} {{ healthy_cp }}"
      loop: "{{ cp_to_remove }}"
      when: cp_to_remove | length > 0
      # NOT ignore_errors: a failed etcd member removal must fail the run loudly
      # rather than silently leaving the departing member in the datastore's
      # membership with auto-compaction counting it toward quorum.

    - name: Verify surviving etcd member count matches desired control plane count
      ansible.builtin.command:
        cmd: "{{ playbook_dir }}/../scripts/check-etcd-members.sh {{ desired_cp_count }} {{ healthy_cp }}"
      when: cp_to_remove | length > 0

    - name: Delete removed worker nodes
      ansible.builtin.command:
        cmd: kubectl delete node {{ item }}
      register: del_wrk
      until: del_wrk.rc == 0
      retries: 6
      delay: 5
      loop: "{{ workers_to_remove }}"
      when: workers_to_remove | length > 0

    - name: Delete removed control plane nodes
      ansible.builtin.command:
        cmd: kubectl delete node {{ item }}
      register: del_cp
      until: del_cp.rc == 0
      retries: 6
      delay: 5
      loop: "{{ cp_to_remove }}"
      when: cp_to_remove | length > 0

    - name: Report completion
      ansible.builtin.debug:
        msg: "Removed {{ nodes_to_remove | length }} node(s): {{ nodes_to_remove }}"
      when: nodes_to_remove | length > 0

    - name: Report no nodes to drain
      ansible.builtin.debug:
        msg: "No nodes need draining. Cluster is in desired state."
      when: nodes_to_remove | length == 0

# ---------------------------------------------------------------------------
# Play 5 — Teardown the departing control plane hosts (the missing official
# step). The kubeadm docs ("Remove the node / Clean up the control plane")
# mandate `kubeadm reset` on the removed control-plane host so the static-pod
# apiserver, controller-manager, scheduler, local kubelet and local etcd are
# actually stopped and cleaned up. Without this the departing host keeps
# running a "zombie" apiserver that stays listening on the VIP (was mitigated
# only by demoting keepalived/haproxy in Play 2). 
#
# This runs AFTER Play 4 has drained the node, removed its etcd member from a
# surviving member (quorum committed) and deleted the Node object, so tearing
# down the host here cannot disturb the surviving cluster. Failures are LOUD:
# a reset that fails means the host still holds cluster state and the run
# must not report success.
# ---------------------------------------------------------------------------
- name: K8s Drain Removed Nodes — Teardown Departing Control Planes
  hosts: departing_cp
  gather_facts: false
  ignore_unreachable: true
  vars:
    cp_to_remove: "{{ hostvars['localhost']['cp_to_remove'] }}"
  tasks:
    - name: Reset kubeadm state on departing control plane host
      ansible.builtin.command:
        cmd: kubeadm reset -f
        timeout: 300
      become: true
      register: _reset
      ignore_errors: true
      changed_when: _reset.rc == 0

    - name: Report kubeadm reset failure (host may already be destroyed)
      ansible.builtin.debug:
        msg: "kubeadm reset failed on this departing control plane (rc={{ _reset.rc }}). If the VM was already destroyed this is expected; if it still exists it must be reset manually before reuse."
      when: _reset.rc != 0 and _reset.rc is defined

    - name: Stop lingering control plane services if kubeadm reset left them
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      become: true
      loop:
        - kubelet
        - etcd
      ignore_errors: true
