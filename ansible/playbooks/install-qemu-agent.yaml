# ===========================================================================
# Install the QEMU guest agent on all k8s nodes.
#
# The guest agent lets Proxmox communicate with the VM (clean shutdowns,
# guest IP reporting). It is normally installed by cloud-init at first boot;
# this play is the idempotent safety net for nodes that missed it. It also
# demonstrates the fact-gathering flow: wait for SSH, then ansible.setup
# collects facts used by later conditionals.
# ===========================================================================
- name: Install and enable QEMU guest agent
  hosts: k8s_control:k8s_worker
  become: yes
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Install qemu-guest-agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
        update_cache: true

    - name: Enable and start qemu-guest-agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
        state: started
