---
# ===========================================================================
# K8s cluster lifecycle playbook.
#
# Runs against the inventory generated from infrastructure.yaml
# (ansible/inventory.json via scripts/generate-inventory.py). The inventory
# groups are: k8s_control, k8s_worker, docker_services.
#
# Execution order matters:
#   1. Configure every node's base OS for k8s (kernel modules, sysctl,
#      containerd, the k8s apt repo and pinned binaries).
#   2. Set up keepalived + haproxy on control plane nodes so the API server
#      is reachable at one virtual IP (VIP) even if a control node dies.
#   3. Register the cluster API DNS name (k8s-<cluster>-api) on pfSense.
#   4. Initialize the control plane (kubeadm init on the leader, join for
#      the rest), install Calico CNI, and publish join commands via hostvars.
#   5. Join the workers using the command the leader generated.
#   6. Apply RBAC so OIDC groups can act on the cluster.
#
# The admin user + patching baseline is NOT here — it lives in common.yaml
# (site.yaml imports it first). This playbook assumes those are done.
# ---------------------------------------------------------------------------
# Play 1 — Base OS preparation on every k8s node.
#
# Kernel prerequisites: overlay + br_netfilter modules (needed for the CNI
# network), sysctl for IPv4 forwarding and bridge traffic filtering.
# Then the container runtime (containerd with SystemdCgroup), the pinned
# k8s apt repository, and the exact kubelet/kubeadm/kubectl version held in
# place so apt never auto-upgrades them mid-cluster.
#
# The task list lives in tasks/k8s-base.yaml, shared with
# k8s-standby-build.yaml so standby (parked spare) VMs are pre-built to
# "ready to join" state.
# ---------------------------------------------------------------------------
- name: K8s common setup
  hosts: k8s_control:k8s_worker
  become: yes
  gather_facts: false
  tasks:
    - name: Include k8s base tasks
      ansible.builtin.include_tasks: tasks/k8s-base.yaml

# ---------------------------------------------------------------------------
# Play 2 — High-availability API endpoint.
#
# keepalived runs the Virtual Router Redundancy Protocol (VRRP): it assigns
# the VIP to one control node and fails it over to another if the holder
# dies. haproxy load-balances TLS to the kube-apiserver on all control nodes.
# Together they give workers a single stable address (the VIP) for the API.
# Templates are rendered from ansible/templates/*.j2 and notify their
# respective handlers to restart on change.
# ---------------------------------------------------------------------------
- name: K8s control plane load balancer (keepalived + haproxy)
  hosts: k8s_control
  become: yes
  gather_facts: false
  tasks:
    # Capture the node's primary IP and default interface so the templates
    # can bind VRRP and haproxy to the right addresses per node.
    - name: Get node IP address
      ansible.builtin.command:
        cmd: hostname -I
      register: _node_ip_raw
      changed_when: false

    - name: Get default interface
      ansible.builtin.shell:
        cmd: "ip route show default | awk 'NR==1{print $5}'"
      register: _default_route
      changed_when: false

    - name: Set node IP and interface facts
      ansible.builtin.set_fact:
        node_ip: "{{ _node_ip_raw.stdout.split()[0] }}"
        node_iface: "{{ _default_route.stdout.strip() }}"

    - name: Install keepalived and haproxy
      ansible.builtin.apt:
        name:
          - keepalived
          - haproxy
        state: present
        update_cache: true

    - name: Render keepalived config
      ansible.builtin.template:
        src: ../templates/keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        mode: "0644"
      notify: Restart keepalived

    - name: Render haproxy config
      ansible.builtin.template:
        src: ../templates/haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        mode: "0644"
      notify: Restart haproxy

    - name: Enable and start keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: started
        enabled: true

    - name: Enable and start haproxy
      ansible.builtin.systemd:
        name: haproxy
        state: started
        enabled: true

  handlers:
    - name: Restart keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: restarted

    - name: Restart haproxy
      ansible.builtin.systemd:
        name: haproxy
        state: restarted

# ---------------------------------------------------------------------------
# Play 3 — Register the cluster API DNS name on pfSense.
#
# "hosts: localhost / connection: local" runs entirely on the control node
# running Ansible (no remote target). It reads infrastructure.yaml via
# slurp+b64decode+from_yaml, finds the DNS-capable host, fetches the pfSense
# API key from Vault, and creates the host override "k8s-<cluster>-api"
# pointing at the cluster VIP. The same workflow is reused for VM DNS
# pre-registration (see terraform/main.tf terraform_data.dns_alloc).
# ---------------------------------------------------------------------------
- name: Create API DNS entry for cluster endpoint
  hosts: localhost
  gather_facts: no
  connection: local
  tasks:
    - name: Skip API DNS entry when no clusters are configured
      ansible.builtin.meta: end_play
      when: groups['k8s_control'] | default([]) | length == 0

    - name: Read infrastructure.yaml
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../../conf/infrastructure.yaml"
      register: infra_raw

    - name: Parse infrastructure.yaml
      ansible.builtin.set_fact:
        infra: "{{ infra_raw.content | b64decode | from_yaml }}"

    - name: Derive cluster name from first control node
      ansible.builtin.set_fact:
        _cluster_name: "{{ groups['k8s_control'][0] | regex_replace('^k8s-(.+)-(?:control|worker)-\\d+$', '\\1') }}"

    - name: Find cluster VIP
      ansible.builtin.set_fact:
        _cluster: "{{ infra.clusters | selectattr('name', 'equalto', _cluster_name) | first }}"
        _dns_domain: "{{ infra.platform.proxmox.dns_domain }}"

    - name: Find docker host and vault port
      ansible.builtin.set_fact:
        _docker_host: "{{ infra.hosts | selectattr('name', 'equalto', 'docker') | first }}"
        _vault_port: "{{ (infra.services.instances.vault | first).port }}"

    - name: Set vault URL
      ansible.builtin.set_fact:
        _vault_url: "https://{{ _docker_host.connection.host | default(_docker_host.name ~ '.' ~ _dns_domain) }}:{{ _vault_port }}"

    - name: Get pfSense API key from Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ _vault_url }}"
        path: infraops/pfsense
        validate_certs: false
      register: vault_pfsense

    - name: Find DNS server host
      ansible.builtin.set_fact:
        _dns_host: "{{ infra.hosts | selectattr('services', 'defined') | selectattr('services', 'contains', 'dns') | first }}"
        _ip_pool: "{{ infra.hosts | selectattr('services', 'defined') | selectattr('services', 'contains', 'dns') | first }}"

    - name: Generate IP pool list
      ansible.builtin.set_fact:
        _ip_list: "{{ range(_ip_pool.ip_pool.start.split('.')[-1] | int, _ip_pool.ip_pool.end.split('.')[-1] | int + 1) | map('string') | map('regex_replace', '^(.*)', _ip_base ~ '.\\1') | list }}"
      vars:
        _ip_base: "{{ _ip_pool.ip_pool.start.split('.')[:3] | join('.') }}"

    - name: Retrieve all DNS Resolver Host Overrides
      pfrest.pfsense.services_dns_resolver_host_overrides_info:
        api_host: "{{ _dns_host.connection.host }}"
        api_key: "{{ vault_pfsense.secret.api_key }}"
        api_protocol: https
        validate_certs: false
      register: dns_result
      retries: 3
      delay: 5
      until: dns_result is defined and dns_result.data is defined

    - name: Set pool overrides fact
      ansible.builtin.set_fact:
        pfsense_host: "{{ _dns_host.connection.host }}"
        pfsense_api_key: "{{ vault_pfsense.secret.api_key }}"
        ip_pool: "{{ _ip_pool.ip_pool }}"
        ip_list: "{{ _ip_list }}"
        pool_overrides: "{{ dns_result.data | selectattr('ip', 'defined') | selectattr('ip.0', 'in', _ip_list) | list | sort(attribute='ip') }}"

    - name: Create API DNS entry
      ansible.builtin.include_tasks: tasks/add-host.yaml
      vars:
        target_item:
          hostname: "k8s-{{ _cluster_name }}-api"
          domain: "{{ _dns_domain }}"
          ip: "{{ _cluster.control_plane.vip }}"

# ---------------------------------------------------------------------------
# Play 4 — Initialize the control plane.
#
# "serial: 1" runs this play ONE host at a time, so the leader fully
# initializes (and publishes join commands to hostvars) before the next
# control node tries to join. cp_leader = the first (alphabetically) control
# node; it runs "kubeadm init --upload-certs", everyone else joins.
#
# After init the leader reconciles the kubeadm-config ConfigMap's
# apiServer.extraArgs against the flags the IaC template renders, so stale
# flags (e.g. a dropped oidc-ca-file pin) can never leak into the manifests a
# promoted standby node generates when it joins. Joining control nodes then
# wait for their LOCAL apiserver (:6444) to become healthy, failing fast with
# logs instead of letting Play 6's node-ready wait time out silently.
#
# Facts shared between hosts: set_fact on the leader is readable by workers
# via hostvars[cp_leader]. The admin kubeconfig, join token, certificate key
# and Calico manifest are all produced here and consumed in Play 5.
# ---------------------------------------------------------------------------
- name: K8s control plane init
  hosts: k8s_control
  become: yes
  gather_facts: false
  serial: 1
  vars:
    cp_leader: "{{ (groups['k8s_control'] | sort)[0] }}"
  tasks:
    - name: Get node IP address
      ansible.builtin.command:
        cmd: hostname -I
      register: _node_ip_raw
      changed_when: false

    - name: Set node IP fact
      ansible.builtin.set_fact:
        node_ip: "{{ _node_ip_raw.stdout.split()[0] }}"

    - name: Template kubeadm config
      ansible.builtin.template:
        src: ../templates/kubeadm-config.yaml.j2
        dest: /tmp/kubeadm-config.yaml
        mode: "0644"

    - name: Check if cluster already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_admin_conf

    - name: Pull kubeadm config images
      ansible.builtin.command:
        cmd: kubeadm config images pull --config /tmp/kubeadm-config.yaml
      changed_when: true
      when: not k8s_admin_conf.stat.exists

    - name: kubeadm init (control plane leader)
      ansible.builtin.command:
        cmd: kubeadm init --config /tmp/kubeadm-config.yaml --upload-certs
      changed_when: true
      register: kubeadm_init
      when:
        - inventory_hostname == cp_leader
        - not k8s_admin_conf.stat.exists

    - name: Reconcile kubeadm-config apiServer.extraArgs against IaC template
      # kubeadm writes the kubeadm-config ConfigMap once at init and never
      # rewrites it; new control-plane nodes join against whatever is in it.
      # If the template changes later (e.g. a stale oidc-ca-file pin was
      # dropped), the ConfigMap keeps the old flags and ghost joins generate
      # apiserver manifests referencing files no node has. Align the extraArgs
      # list with the flags this template renders, so joins see current config.
      ansible.builtin.script:
        "{{ playbook_dir }}/../../scripts/reconcile-kubeadm-config.py --kubeconfig /etc/kubernetes/admin.conf oidc-issuer-url={{ oidc_issuer_url }} oidc-client-id={{ oidc_client_id }} oidc-username-claim=preferred_username oidc-groups-claim=groups"
      register: kubeadm_config_reconcile
      changed_when: "'updated' in kubeadm_config_reconcile.stdout"
      ignore_errors: true
      when: inventory_hostname == cp_leader

    - name: kubeadm join (additional control plane node)
      ansible.builtin.command:
        cmd: "{{ hostvars[cp_leader]['k8s_cp_join_command'] }}"
      changed_when: true
      when:
        - inventory_hostname != cp_leader
        - not k8s_admin_conf.stat.exists

    - name: Wait for local API server on additional control nodes
      # A control-plane join writes the static apiserver manifest and the
      # kubelet starts it immediately; the play's later "wait for all nodes
      # ready" (Play 6) would otherwise time out silently after 15 minutes on
      # a crash-looping apiserver. Fail fast here, dumping the kubelet +
      # apiserver container logs so the cause is obvious.
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../scripts/wait-local-apiserver.sh {{ node_ip }} {{ inventory_hostname }}"
      changed_when: false
      when: inventory_hostname != cp_leader

    - name: Create .kube directory for ansible user
      ansible.builtin.file:
        path: /home/ansible/.kube
        state: directory
        owner: ansible
        group: ansible
        mode: "0700"
      when: inventory_hostname == cp_leader

    - name: Copy admin kubeconfig for ansible user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ansible/.kube/config
        remote_src: true
        owner: ansible
        group: ansible
        mode: "0600"
      when: inventory_hostname == cp_leader

    - name: "Create .kube directory for {{ infra_admin_user }} user"
      ansible.builtin.file:
        path: "/home/{{ infra_admin_user }}/.kube"
        state: directory
        owner: "{{ infra_admin_user }}"
        group: "{{ infra_admin_group }}"
        mode: "0700"
      when: inventory_hostname == cp_leader

    - name: "Copy admin kubeconfig for {{ infra_admin_user }} user"
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ infra_admin_user }}/.kube/config"
        remote_src: true
        owner: "{{ infra_admin_user }}"
        group: "{{ infra_admin_group }}"
        mode: "0600"
      when: inventory_hostname == cp_leader

    - name: Read admin kubeconfig for worker distribution
      ansible.builtin.slurp:
        src: /etc/kubernetes/admin.conf
      register: admin_kubeconfig
      when: inventory_hostname == cp_leader

    - name: Share admin kubeconfig with worker hosts
      ansible.builtin.set_fact:
        k8s_admin_kubeconfig: "{{ admin_kubeconfig.content | b64decode }}"
      when: inventory_hostname == cp_leader

    - name: Download Calico manifest
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml"
        dest: /tmp/calico.yaml
        mode: "0644"
      when: inventory_hostname == cp_leader

    - name: Rewrite Calico images to local registry
      ansible.builtin.replace:
        path: /tmp/calico.yaml
        regexp: 'image: docker.io/calico/([a-z-]+)'
        replace: 'image: {{ k8s_image_repository }}/calico-\1'
      when: inventory_hostname == cp_leader

    - name: Enable WireGuard in Calico manifest
      ansible.builtin.command:
        cmd: |
          sed -i '/CALICO_IPV6POOL_CIDR/a\            - name: WIREGUARD_ENABLED\n              value: "true"' /tmp/calico.yaml
      when: inventory_hostname == cp_leader

    - name: Wait for API server to be ready
      ansible.builtin.command:
        cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes --request-timeout=5s
      register: _api_check
      until: _api_check.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      when: inventory_hostname == cp_leader

    - name: Install Calico CNI
      ansible.builtin.command:
        cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf apply --validate=false -f /tmp/calico.yaml
      changed_when: true
      when: inventory_hostname == cp_leader

    - name: Create join token for nodes
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      changed_when: true
      register: join_command
      when: inventory_hostname == cp_leader

    - name: Upload control plane certificates
      ansible.builtin.command:
        cmd: kubeadm init phase upload-certs --upload-certs
      changed_when: true
      register: cert_key_raw
      when: inventory_hostname == cp_leader

    - name: Share worker and control-plane join commands
      ansible.builtin.set_fact:
        k8s_join_command: "kubeadm join {{ cp_endpoint }} --token {{ join_command.stdout | regex_search('(?<=--token )[^ ]+') }} --discovery-token-ca-cert-hash {{ join_command.stdout | regex_search('(?<=--discovery-token-ca-cert-hash )[^ ]+') }}"
        k8s_cp_join_command: "kubeadm join {{ cp_endpoint }} --token {{ join_command.stdout | regex_search('(?<=--token )[^ ]+') }} --discovery-token-ca-cert-hash {{ join_command.stdout | regex_search('(?<=--discovery-token-ca-cert-hash )[^ ]+') }} --control-plane --certificate-key {{ cert_key_raw.stdout | regex_search('[a-f0-9]{64}') }} --apiserver-bind-port 6444"
      when: inventory_hostname == cp_leader

# ---------------------------------------------------------------------------
# Play 5 — Join workers.
#
# Each worker reads the join command the leader stored in hostvars and runs
# it. kubelet.conf existing means the node already joined (stat check) so the
# play is idempotent. Workers also get the admin kubeconfig copied from the
# leader so the admin user can manage the cluster from any node.
# ---------------------------------------------------------------------------
- name: K8s workers join
  hosts: k8s_worker
  become: yes
  gather_facts: false
  tasks:
    - name: Check if node already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: k8s_kubelet_conf

    - name: Get join command from control plane
      ansible.builtin.set_fact:
        k8s_join_command: "{{ hostvars[(groups['k8s_control'] | sort)[0]]['k8s_join_command'] }}"
      when: not k8s_kubelet_conf.stat.exists

    - name: Join the cluster
      ansible.builtin.command:
        cmd: "{{ k8s_join_command }}"
      changed_when: true
      when: not k8s_kubelet_conf.stat.exists

    - name: "Create .kube directory for {{ infra_admin_user }} user"
      ansible.builtin.file:
        path: "/home/{{ infra_admin_user }}/.kube"
        state: directory
        owner: "{{ infra_admin_user }}"
        group: "{{ infra_admin_group }}"
        mode: "0700"

    - name: "Copy admin kubeconfig from control plane to {{ infra_admin_user }} user"
      ansible.builtin.file:
        path: "/home/{{ infra_admin_user }}/.kube"
        state: directory
        owner: "{{ infra_admin_user }}"
        group: "{{ infra_admin_group }}"
        mode: "0700"

    - name: "Write kubeconfig for {{ infra_admin_user }} user"
      ansible.builtin.copy:
        dest: "/home/{{ infra_admin_user }}/.kube/config"
        content: "{{ hostvars[(groups['k8s_control'] | sort)[0]]['k8s_admin_kubeconfig'] }}"
        owner: "{{ infra_admin_user }}"
        group: "{{ infra_admin_group }}"
        mode: "0600"

# ---------------------------------------------------------------------------
# Play 6 — RBAC.
#
# Maps OIDC identity groups (configured in Keycloak) to Kubernetes roles.
# cluster-admin binds the k8s-admins and <cluster>-admins groups to full
# control; <cluster>-viewers is bound to the read-only "view" role. The
# kubectl wait first blocks until every node reports Ready, so RBAC applies
# to a fully formed cluster.
# ---------------------------------------------------------------------------
- name: K8s RBAC
  hosts: k8s_control
  become: yes
  gather_facts: false
  tasks:
    - name: Wait for all nodes ready
      ansible.builtin.command:
        cmd: kubectl wait --for=condition=Ready nodes --all --timeout=900s --kubeconfig /etc/kubernetes/admin.conf
      changed_when: false

    - name: Create ClusterRoleBinding for k8s-admins (legacy)
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: k8s-admins-cluster-admin
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cluster-admin
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: Group
              name: k8s-admins

    - name: Create ClusterRoleBinding for {{ cluster_name }}-admins
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: "{{ cluster_name }}-admins-cluster-admin"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cluster-admin
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: Group
              name: "{{ cluster_name }}-admins"

    - name: Create ClusterRoleBinding for {{ cluster_name }}-viewers
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: "{{ cluster_name }}-viewers"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: view
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: Group
              name: "{{ cluster_name }}-viewers"
