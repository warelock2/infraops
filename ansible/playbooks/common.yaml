# ===========================================================================
# Common baseline playbook — applied to every host marked for
# configuration_management in conf/infrastructure.yaml.
#
# This is the "shared" layer of config management, distinct from the k8s and
# service playbooks. It runs first (site.yaml imports it before everything
# else) so that every managed machine — k8s nodes and non-k8s VMs alike —
# converges on the same baseline:
#
#   Play 1 — accounts: the admin (warelock) account with the SSH key injected
#            by CI. NOTE: the "ansible" automation account is deliberately NOT
#            created here — the golden VM image bakes it in at build time
#            (scripts/create_golden_image_vm.sh sets --ciuser ansible and the
#            ansible.pub key) and Terraform also injects it via user_account.
#   Play 2 — patching: apt update + upgrade. kubelet/kubeadm/kubectl are
#            apt-mark held by the k8s playbook on existing nodes, so upgrades
#            never break the cluster. Whether to reboot afterwards is decided
#            by the final-act playbook (site.yaml runs it last) based on the
#            per-host post_patch_reboot flag in the SSOT.
# ===========================================================================
---
- name: Baseline accounts on all managed hosts
  hosts: configuration_management
  become: yes
  gather_facts: false
  tasks:
    # Single run-wide connection gate. The readiness handshake has already
    # proven created VMs are booted, past the cloud-init reboot, and sshd is
    # up (see scripts/cloud-init-reboot.yaml.template); persistent hosts like
    # docker are not Terraform-created and are always up. So this is just a
    # cheap "every target answers SSH" check that also verifies the ansible
    # SSH key authenticates, before any config work begins.
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        delay: 0
        timeout: 120

    - name: Create admin user
      ansible.builtin.user:
        name: "{{ infra_admin_user }}"
        shell: /bin/bash
        groups: sudo
        append: yes
        state: present

    - name: Create .ssh directory
      ansible.builtin.file:
        path: "/home/{{ infra_admin_user }}/.ssh"
        state: directory
        mode: "0700"
        owner: "{{ infra_admin_user }}"
        group: "{{ infra_admin_group }}"

    - name: Add CI-injected SSH public key
      ansible.posix.authorized_key:
        user: "{{ infra_admin_user }}"
        state: present
        key: "{{ lookup('file', infra_ssh_key_file) }}"
        exclusive: no

    - name: Add repo-tracked admin SSH public keys
      ansible.posix.authorized_key:
        user: "{{ infra_admin_user }}"
        state: present
        key: "{{ lookup('file', item) }}"
        exclusive: no
      loop: "{{ query('fileglob', playbook_dir + '/../files/warelock-*.pub') }}"

    - name: "Ensure {{ infra_admin_user }} can sudo without password"
      ansible.builtin.lineinfile:
        path: "/etc/sudoers.d/{{ infra_admin_user }}"
        line: "{{ infra_admin_user }} ALL=(ALL) NOPASSWD: ALL"
        create: yes
        mode: "0440"
        validate: "visudo -cf %s"

# ---------------------------------------------------------------------------
# Play 2 — System patching.
#
# Runs on the same managed set. Uses "safe" upgrade (plain apt upgrade, not
# dist-upgrade) so held packages (the k8s trio on existing nodes) are left
# alone. Reboot handling is NOT here — final-act.yaml decides whether to reboot
# or notify based on each host's post_patch_reboot flag in the SSOT.
# ---------------------------------------------------------------------------
- name: Patch all managed hosts
  hosts: configuration_management
  become: yes
  gather_facts: false
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: safe
