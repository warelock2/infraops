---
# ===========================================================================
# k8s-standby-build.yaml — build standby (parked spare) node VMs.
#
# Runs against the standby-only inventory generated by
# scripts/generate-inventory.py --standby (groups: k8s_standby). It applies
# the same k8s base preparation tasks as k8s-cluster.yaml Play 1 (shared via
# tasks/k8s-base.yaml) so a standby VM is pre-built to "ready to join" state.
#
# A standby node is deliberately NOT joined to the cluster: no keepalived,
# no haproxy, no etcd, no kubeadm join. It is parked powered-off after this
# build; when it is later promoted (increasing plane.nodes) the CI workflow
# boots it and the normal k8s-cluster plays join it. Config drift (e.g. a
# k8s version bump while parked) is converged away by the idempotent base
# tasks re-running at promotion time.
#
# The common baseline (accounts + patching) is applied by the build step via
# common.yaml BEFORE this playbook, so ghosts are built like any other node.
# ===========================================================================
- name: K8s standby base setup
  hosts: k8s_standby
  become: yes
  gather_facts: false
  tasks:
    - name: Include k8s base tasks
      ansible.builtin.include_tasks: tasks/k8s-base.yaml
