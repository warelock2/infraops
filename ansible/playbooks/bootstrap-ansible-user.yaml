# ===========================================================================
# One-off bootstrap: create the "ansible" user on freshly built VMs.
#
# New VMs boot with the cloud-init user (e.g. "ubuntu") and no password.
# This play runs as that user over SSH, waits for connectivity, then creates
# the ansible user with our public key so all subsequent plays can connect
# as "ansible" (the default remote_user in ansible.cfg).
# ===========================================================================
- name: Bootstrap ansible user on new VMs
  hosts: k8s_control:k8s_worker
  remote_user: ubuntu
  become: yes
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

    - name: Create ansible user .ssh directory
      ansible.builtin.file:
        path: /home/ansible/.ssh
        state: directory
        owner: ansible
        group: ansible
        mode: "0700"

    # copy (not authorized_key) so this works even without the ansible.posix
    # collection on a bare image.
    - name: Copy public key to ansible user
      ansible.builtin.copy:
        src: ../files/ansible.pub
        dest: /home/ansible/.ssh/authorized_keys
        owner: ansible
        group: ansible
        mode: "0600"
