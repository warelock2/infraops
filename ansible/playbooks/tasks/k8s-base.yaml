---
# ===========================================================================
# k8s-base.yaml — shared base OS preparation tasks for k8s nodes.
#
# Included by TWO playbooks:
#   * k8s-cluster.yaml (Play 1) — every live control/worker node.
#   * k8s-standby-build.yaml      — freshly-created standby (parked spare) VMs,
#     pre-building them to "ready to join" state.
#
# Kernel prerequisites (overlay + br_netfilter modules, sysctl for IPv4
# forwarding and bridge filtering), containerd with SystemdCgroup, the pinned
# k8s apt repository, the exact held kubelet/kubeadm/kubectl version, and
# wireguard. Requirements come from group_vars/all (k8s_version etc.).
# ===========================================================================
- name: Gather facts
  ansible.builtin.setup:

# Load the kernel modules immediately (modprobe) AND persist them in
# /etc/modules-load.d so they survive a reboot.
- name: Load kernel modules for k8s
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Configure sysctl for k8s
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    mode: "0644"
  register: _sysctl_config

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  when: _sysctl_config.changed

- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true

- name: Configure containerd with SystemdCgroup
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/../scripts/configure-containerd.sh"
  args:
    creates: /etc/containerd/config.toml

- name: Enable and restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: true

- name: Set k8s major.minor version
  ansible.builtin.set_fact:
    k8s_major_minor: "{{ k8s_version | regex_replace('^(\\d+\\.\\d+)\\..*$', '\\1') }}"

- name: Add k8s apt key
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/../scripts/add-k8s-apt-key.sh {{ k8s_major_minor }}"
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add k8s apt repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_major_minor }}/deb/ /"
    filename: kubernetes
    state: present

- name: Install kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name:
      - "kubelet={{ k8s_version }}-*"
      - "kubeadm={{ k8s_version }}-*"
      - "kubectl={{ k8s_version }}-*"
    state: present
    update_cache: true

- name: Hold k8s packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Install wireguard-tools
  ansible.builtin.apt:
    name: wireguard-tools
    state: present

- name: Load wireguard kernel module
  community.general.modprobe:
    name: wireguard
    state: present

- name: Install kubernetes Python library
  ansible.builtin.apt:
    name: python3-kubernetes
    state: present

- name: Extract cluster name from hostname
  ansible.builtin.set_fact:
    cluster_name: "{{ inventory_hostname | regex_replace('^k8s-(.+)-(?:control|worker)-\\d+$', '\\1') }}"
    oidc_client_id: "kubernetes-{{ inventory_hostname | regex_replace('^k8s-(.+)-(?:control|worker)-\\d+$', '\\1') }}"
  when: inventory_hostname is match('^k8s-.+-(?:control|worker)-\\d+$')

- name: Create pki directory
  ansible.builtin.file:
    path: /etc/kubernetes/pki
    state: directory
    mode: "0755"
  when: "'k8s_control' in groups and inventory_hostname in groups['k8s_control']"
