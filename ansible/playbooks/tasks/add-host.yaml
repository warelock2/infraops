# ===========================================================================
# Task file: add one DNS host override to the IAC pool on pfSense.
#
# Included from run-step.yaml in a loop, so `target_item` is set per iteration
# (loop_var). Idempotent: skips if the host already exists. IP resolution
# logic: use a caller-provided IP, otherwise allocate the first free IP from
# the pool by rejecting already-used IPs.
# ===========================================================================
---
# Add a single DNS host override to the IAC pool.
# Expects: target_item.hostname, target_item.domain
# Optional: target_item.ip (if set, use this IP instead of allocating from pool)
# Updates: used_ips (fact), pool_overrides (fact)

- name: Add — check if target already exists in pool
  ansible.builtin.set_fact:
    existing: "{{ pool_overrides | selectattr('host', 'equalto', target_item.hostname) | selectattr('domain', 'equalto', target_item.domain) | list }}"

# ---------------------------------------------------------------------------
# IP resolution: caller-provided IP wins, otherwise allocate the first free
# IP from the pool (ip_list minus already-used IPs), and fail loudly if the
# pool is exhausted. Each guard repeats `existing | length == 0` so a target
# that already exists is skipped at every step (idempotent).
# ---------------------------------------------------------------------------
- name: Add — skip if target already exists
  ansible.builtin.debug:
    msg: "{{ target_item.hostname }}.{{ target_item.domain }} already exists in pool — skipping"
  when: existing | length > 0

- name: Add — use provided IP
  ansible.builtin.set_fact:
    next_ip: "{{ target_item.ip }}"
  when:
    - existing | length == 0
    - target_item.ip is defined

- name: Add — find next free IP from pool
  ansible.builtin.set_fact:
    next_ip: "{{ ip_list | reject('in', used_ips) | list | first }}"
  when:
    - existing | length == 0
    - target_item.ip is not defined

- name: Add — fail if no free IPs
  ansible.builtin.fail:
    msg: "No free IPs available in pool ({{ ip_pool.start }}-{{ ip_pool.end }})"
  when:
    - existing | length == 0
    - next_ip is not defined

- name: Add — create host override
  pfrest.pfsense.services_dns_resolver_host_override:
    api_host: "{{ pfsense_host }}"
    api_key: "{{ pfsense_api_key }}"
    api_protocol: https
    validate_certs: false
    state: present
    lookup_fields: ["host", "domain"]
    host: "{{ target_item.hostname }}"
    domain: "{{ target_item.domain }}"
    ip:
      - "{{ next_ip }}"
  when: existing | length == 0

- name: Add — apply DNS resolver changes
  pfrest.pfsense.services_dns_resolver_apply:
    api_host: "{{ pfsense_host }}"
    api_key: "{{ pfsense_api_key }}"
    api_protocol: https
    validate_certs: false
  when: existing | length == 0

- name: Add — display result
  ansible.builtin.debug:
    msg: "Created {{ target_item.hostname }}.{{ target_item.domain }} = {{ next_ip }}"
  when: existing | length == 0

- name: Add — refresh overrides
  pfrest.pfsense.services_dns_resolver_host_overrides_info:
    api_host: "{{ pfsense_host }}"
    api_key: "{{ pfsense_api_key }}"
    api_protocol: https
    validate_certs: false
  register: dns_result
  when: existing | length == 0

- name: Add — update pool overrides
  ansible.builtin.set_fact:
    all_overrides: "{{ dns_result.data }}"
    pool_overrides: "{{ dns_result.data | selectattr('ip', 'defined') | selectattr('ip.0', 'in', ip_list) | list | sort(attribute='ip') }}"
    used_ips: "{{ dns_result.data | selectattr('ip', 'defined') | selectattr('ip.0', 'in', ip_list) | list | map(attribute='ip') | flatten | intersect(ip_list) }}"
  when: existing | length == 0
