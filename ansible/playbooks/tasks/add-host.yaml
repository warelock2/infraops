# ===========================================================================
# Task file: add one DNS host override to the IAC pool on pfSense.
#
# Included from run-step.yaml in a loop, so `target_item` is set per iteration
# (loop_var). IP resolution logic: use a caller-provided IP, otherwise
# allocate the first free IP from the pool by rejecting already-used IPs.
#
# When an entry already exists, verify the IP is still valid:
#   - If the IP is outside the pool range, it's a ghost → delete and
#     re-allocate from the pool.
#   - If the IP is in pool, it's either correct or a previously-shuffled
#     allocation. Either way it's reachable → skip.
# ===========================================================================
---
# Add a single DNS host override to the IAC pool.
# Expects: target_item.hostname, target_item.domain
# Optional: target_item.ip (if set, use this IP instead of allocating from pool)
# Updates: used_ips (fact), pool_overrides (fact)

- name: Add — check if target already exists in pool
  ansible.builtin.set_fact:
    existing: "{{ pool_overrides | selectattr('host', 'equalto', target_item.hostname) | selectattr('domain', 'equalto', target_item.domain) | list }}"

# ---------------------------------------------------------------------------
# Ghost cleanup: if the existing entry's IP is outside the pool range, it's a
# stale ghost from a previous run. Delete it and let the allocation below
# create a fresh in-pool entry. In-pool entries are always kept as-is — they
# may have been shuffled by a previous destroy+create cycle, but the IP is
# valid and reachable, so re-allocating would only create churn.
# ---------------------------------------------------------------------------
- name: Add — check if existing IP is in pool
  ansible.builtin.set_fact:
    _existing_ip: "{{ existing[0].ip if existing | length > 0 else '' }}"
    _existing_in_pool: "{{ (existing | length > 0) and (existing[0].ip is defined) and (existing[0].ip in ip_list) }}"

- name: Add — delete ghost entry (IP outside pool)
  ansible.builtin.uri:
    url: "https://{{ pfsense_host }}/api/v2/services/dns_resolver/host_overrides?host={{ target_item.hostname }}&domain={{ target_item.domain }}"
    method: DELETE
    headers:
      x-api-key: "{{ pfsense_api_key }}"
    validate_certs: false
    status_code: [200]
  when:
    - existing | length > 0
    - not _existing_in_pool
  register: _ghost_deleted

- name: Add — apply DNS after ghost deletion
  pfrest.pfsense.services_dns_resolver_apply:
    api_host: "{{ pfsense_host }}"
    api_key: "{{ pfsense_api_key }}"
    api_protocol: https
    validate_certs: false
  when: _ghost_deleted is changed

- name: Add — refresh pool overrides after ghost deletion
  pfrest.pfsense.services_dns_resolver_host_overrides_info:
    api_host: "{{ pfsense_host }}"
    api_key: "{{ pfsense_api_key }}"
    api_protocol: https
    validate_certs: false
  register: _refreshed_overrides
  when: _ghost_deleted is changed

- name: Add — update facts after ghost deletion
  ansible.builtin.set_fact:
    pool_overrides: "{{ _refreshed_overrides.data | selectattr('ip', 'defined') | selectattr('ip.0', 'in', ip_list) | list | sort(attribute='ip') if (_ghost_deleted is changed) else pool_overrides }}"
    existing: []
  when: _ghost_deleted is changed

# ---------------------------------------------------------------------------
# IP resolution: caller-provided IP wins, otherwise allocate the first free
# IP from the pool (ip_list minus already-used IPs), and fail loudly if the
# pool is exhausted.
# ---------------------------------------------------------------------------
- name: Add — use provided IP
  ansible.builtin.set_fact:
    next_ip: "{{ target_item.ip }}"
  when:
    - existing | length == 0
    - target_item.ip is defined

- name: Add — allocate first free pool IP
  ansible.builtin.set_fact:
    used_ips: "{{ pool_overrides | map(attribute='ip') | flatten | intersect(ip_list) }}"
  when:
    - existing | length == 0
    - target_item.ip is not defined

- name: Add — allocate first free pool IP (actual)
  ansible.builtin.set_fact:
    next_ip: "{{ ip_list | reject('in', used_ips) | first }}"
  when:
    - existing | length == 0
    - target_item.ip is not defined

- name: Add — fail if pool exhausted
  ansible.builtin.fail:
    msg: "Pool exhausted — no free IPs in {{ ip_pool.start }}-{{ ip_pool.end }}"
  when:
    - existing | length == 0
    - next_ip is not defined

- name: Add — skip if target already exists (in-pool, valid)
  ansible.builtin.debug:
    msg: "{{ target_item.hostname }}.{{ target_item.domain }} already exists in pool ({{ _existing_ip }}) — skipping"
  when:
    - existing | length > 0
    - _existing_in_pool

- name: Add — debug planned IP
  ansible.builtin.debug:
    msg: "Allocating {{ target_item.hostname }}.{{ target_item.domain }} -> {{ next_ip }}"
  when: existing | length == 0

# ---------------------------------------------------------------------------
# Create the host override via the pfREST Ansible collection, then apply DNS
# resolver changes so the new entry takes effect immediately.
# ---------------------------------------------------------------------------
- name: Add — create host override
  pfrest.pfsense.services_dns_resolver_host_override:
    api_host: "{{ pfsense_host }}"
    api_key: "{{ pfsense_api_key }}"
    api_protocol: https
    validate_certs: false
    state: present
    lookup_fields: ["host", "domain"]
    host: "{{ target_item.hostname }}"
    domain: "{{ target_item.domain }}"
    ip:
      - "{{ next_ip }}"
  when: existing | length == 0

- name: Add — apply DNS resolver changes
  pfrest.pfsense.services_dns_resolver_apply:
    api_host: "{{ pfsense_host }}"
    api_key: "{{ pfsense_api_key }}"
    api_protocol: https
    validate_certs: false
  when: existing | length == 0

# ---------------------------------------------------------------------------
# Post-creation verification: confirm the entry actually resolves in Unbound.
# The pfSense API may return 200 but Unbound hasn't picked it up yet (or
# something is misconfigured). Fail hard if the entry doesn't resolve —
# Terraform's outer retry loop will re-apply from scratch.
# ---------------------------------------------------------------------------
- name: Add — verify DNS entry resolves to expected IP
  ansible.builtin.command: >
    python3 -c "
    import socket, sys
    fqdn = '{{ target_item.hostname }}.{{ target_item.domain }}'
    expected = '{{ next_ip }}'
    try:
        answers = set()
        for res in socket.getaddrinfo(fqdn, None, socket.AF_INET):
            answers.add(res[4][0])
        if not answers:
            print(f'NO_DNS: {fqdn} did not resolve', file=sys.stderr); sys.exit(1)
        if expected not in answers:
            print(f'WRONG_IP: {fqdn} resolved to {answers}, expected {expected}', file=sys.stderr); sys.exit(2)
        print(f'OK: {fqdn} -> {expected}')
    except socket.gaierror as e:
        print(f'DNS_ERROR: {fqdn} — {e}', file=sys.stderr); sys.exit(3)
    "
  register: _dns_verify
  retries: 3
  delay: 5
  until: _dns_verify.rc == 0
  when: existing | length == 0

- name: Add — fail if DNS entry did not propagate
  ansible.builtin.fail:
    msg: >
      DNS entry for {{ target_item.hostname }}.{{ target_item.domain }} created via API
      (expected IP: {{ next_ip }}) but not resolvable after retries —
      pfSense/Unbound may be misconfigured.
      Output: {{ _dns_verify.stderr | default('no output') }}
  when:
    - existing | length == 0
    - _dns_verify.rc | default(1) != 0

- name: Add — refresh pool overrides after creation
  pfrest.pfsense.services_dns_resolver_host_overrides_info:
    api_host: "{{ pfsense_host }}"
    api_key: "{{ pfsense_api_key }}"
    api_protocol: https
    validate_certs: false
  register: _post_create_overrides
  when: existing | length == 0

- name: Add — update pool overrides after creation
  ansible.builtin.set_fact:
    pool_overrides: "{{ _post_create_overrides.data | selectattr('ip', 'defined') | selectattr('ip.0', 'in', ip_list) | list | sort(attribute='ip') if (existing | length == 0) else pool_overrides }}"
    used_ips: "{{ _post_create_overrides.data | selectattr('ip', 'defined') | selectattr('ip.0', 'in', ip_list) | list | map(attribute='ip') | flatten | intersect(ip_list) if (existing | length == 0) else used_ips }}"
  when: existing | length == 0

- name: Add — display result
  ansible.builtin.debug:
    msg: "Added {{ target_item.hostname }}.{{ target_item.domain }} = {{ next_ip }}"
  when: existing | length == 0
