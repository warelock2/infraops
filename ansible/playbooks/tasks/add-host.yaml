# ===========================================================================
# Task file: add one DNS host override to the IAC pool on pfSense.
#
# IaC is declarative — we don't ask "what's there?" We delete whatever
# exists, create what should be there, and verify it's correct. Every
# host, every time. No conditionals on "does it already exist?".
#
# Included from run-step.yaml in a loop, so `target_item` is set per
# iteration (loop_var).
# ===========================================================================
---
# Expects: target_item.hostname, target_item.domain
# Optional: target_item.ip (if set, use this IP instead of allocating from pool)

# ---------------------------------------------------------------------------
# IP allocation: caller-provided IP wins, otherwise allocate the first free
# IP from the pool (ip_list minus already-used IPs).
# ---------------------------------------------------------------------------
- name: Add — use provided IP
  ansible.builtin.set_fact:
    next_ip: "{{ target_item.ip }}"
  when: target_item.ip is defined

- name: Add — allocate first free pool IP
  ansible.builtin.set_fact:
    used_ips: "{{ pool_overrides | map(attribute='ip') | flatten | intersect(ip_list) }}"
  when: target_item.ip is not defined

- name: Add — allocate first free pool IP (actual)
  ansible.builtin.set_fact:
    next_ip: "{{ ip_list | reject('in', used_ips) | first }}"
  when: target_item.ip is not defined

- name: Add — fail if pool exhausted
  ansible.builtin.fail:
    msg: "Pool exhausted — no free IPs in {{ ip_pool.start }}-{{ ip_pool.end }}"
  when: next_ip is not defined

- name: Add — debug planned IP
  ansible.builtin.debug:
    msg: "Allocating {{ target_item.hostname }}.{{ target_item.domain }} -> {{ next_ip }}"

# ---------------------------------------------------------------------------
# Steamroller: delete → create → verify. Clear whatever exists (ignore
# not-found), then enforce the desired state. CRUD operations are requests
# that can fail or be denied, so each step retries on transient errors.
# ---------------------------------------------------------------------------
- name: Delete — remove host override (ignore not found)
  ansible.builtin.uri:
    url: "https://{{ pfsense_host }}/api/v2/services/dns_resolver/host_overrides?host={{ target_item.hostname }}&domain={{ target_item.domain }}"
    method: DELETE
    headers:
      x-api-key: "{{ pfsense_api_key }}"
    validate_certs: false
    status_code: [200, 404]
  retries: 3
  delay: 2
  until: _delete_result.status in [200, 404]
  register: _delete_result

- name: Apply — DNS resolver changes after delete
  ansible.builtin.uri:
    url: "https://{{ pfsense_host }}/api/v2/services/dns_resolver/apply"
    method: POST
    headers:
      x-api-key: "{{ pfsense_api_key }}"
    validate_certs: false
    status_code: [200, 202]

- name: Wait — for Unbound to settle after delete
  ansible.builtin.pause:
    seconds: 3

- name: Create — host override (retry loop)
  ansible.builtin.uri:
    url: "https://{{ pfsense_host }}/api/v2/services/dns_resolver/host_overrides/{{ target_item.hostname }}/{{ target_item.domain }}"
    method: PUT
    headers:
      x-api-key: "{{ pfsense_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      host: "{{ target_item.hostname }}"
      domain: "{{ target_item.domain }}"
      ip:
        - "{{ next_ip }}"
    validate_certs: false
    status_code: [200, 201]
  register: _create_result
  retries: 3
  delay: 5
  until: _create_result.status in [200, 201]

- name: Apply — DNS resolver changes after create
  ansible.builtin.uri:
    url: "https://{{ pfsense_host }}/api/v2/services/dns_resolver/apply"
    method: POST
    headers:
      x-api-key: "{{ pfsense_api_key }}"
    validate_certs: false
    status_code: [200, 202]

- name: Wait — for Unbound propagation
  ansible.builtin.pause:
    seconds: 5

# ---------------------------------------------------------------------------
# Verify: confirm the entry exists in the override list and resolves
# correctly. If not found, loop back and retry creation. Fail hard
# after max retries — Terraform's outer retry loop handles escalation.
# ---------------------------------------------------------------------------
- name: Verify — entry exists in pfSense overrides
  ansible.builtin.uri:
    url: "https://{{ pfsense_host }}/api/v2/services/dns_resolver/host_overrides?host={{ target_item.hostname }}&domain={{ target_item.domain }}"
    method: GET
    headers:
      x-api-key: "{{ pfsense_api_key }}"
    validate_certs: false
    status_code: [200]
  register: _verify_result
  retries: 3
  delay: 5
  until: >
    (_verify_result.json.data | default([]) | selectattr('ip', 'defined') | selectattr('ip.0', 'in', ip_list) | list | length) > 0

# ---------------------------------------------------------------------------
# Refresh pool overrides fact so subsequent hosts see updated state.
# ---------------------------------------------------------------------------
- name: Add — refresh pool overrides after creation
  ansible.builtin.set_fact:
    pool_overrides: "{{ _verify_result.json.data | default([]) | selectattr('ip', 'defined') | selectattr('ip.0', 'in', ip_list) | list | sort(attribute='ip') }}"
    used_ips: "{{ _verify_result.json.data | default([]) | selectattr('ip', 'defined') | selectattr('ip.0', 'in', ip_list) | list | map(attribute='ip') | flatten | intersect(ip_list) }}"

- name: Add — display result
  ansible.builtin.debug:
    msg: "Added {{ target_item.hostname }}.{{ target_item.domain }} = {{ next_ip }}"
