---
# Delete a single DNS host override from the IAC pool.
# Expects: target_item.hostname, target_item.domain
# Also cleans up API DNS entry if no cluster-named hosts remain.

- name: Delete — find target in pool overrides
  ansible.builtin.set_fact:
    target_override: "{{ pool_overrides | selectattr('host', 'equalto', target_item.hostname) | selectattr('domain', 'equalto', target_item.domain) | list }}"

- name: Delete — fail if target not found
  ansible.builtin.fail:
    msg: "{{ target_item.hostname }}.{{ target_item.domain }} not found in pool"
  when: target_override | length == 0

- name: Delete — remove host override via plural endpoint
  ansible.builtin.uri:
    url: "https://{{ pfsense_host }}/api/v2/services/dns_resolver/host_overrides?host={{ target_item.hostname }}&domain={{ target_item.domain }}"
    method: DELETE
    headers:
      x-api-key: "{{ pfsense_api_key }}"
    validate_certs: false
    status_code: [200]

- name: Delete — apply DNS resolver changes
  pfrest.pfsense.services_dns_resolver_apply:
    api_host: "{{ pfsense_host }}"
    api_key: "{{ pfsense_api_key }}"
    api_protocol: https
    validate_certs: false

- name: Delete — display result
  ansible.builtin.debug:
    msg: "Deleted {{ target_item.hostname }}.{{ target_item.domain }} = {{ target_override[0].ip | first }}"

- name: Delete — refresh overrides
  pfrest.pfsense.services_dns_resolver_host_overrides_info:
    api_host: "{{ pfsense_host }}"
    api_key: "{{ pfsense_api_key }}"
    api_protocol: https
    validate_certs: false
  register: dns_result

- name: Delete — update pool overrides
  ansible.builtin.set_fact:
    all_overrides: "{{ dns_result.data }}"
    pool_overrides: "{{ dns_result.data | selectattr('ip', 'defined') | selectattr('ip.0', 'in', ip_list) | list | sort(attribute='ip') }}"
    used_ips: "{{ dns_result.data | selectattr('ip', 'defined') | selectattr('ip.0', 'in', ip_list) | list | map(attribute='ip') | flatten | intersect(ip_list) }}"

# ── API DNS cleanup ───────────────────────────────────
# If the deleted host was part of a k8s cluster (k8s-{name}-*),
# check if any cluster-named hosts remain. If none, delete the API DNS entry.

- name: Delete API — extract cluster name from hostname
  ansible.builtin.set_fact:
    _cluster_name: "{{ target_item.hostname.split('-')[1] if target_item.hostname.startswith('k8s-') and target_item.hostname.split('-') | length >= 3 else '' }}"

- name: Delete API — find remaining cluster-named hosts
  ansible.builtin.set_fact:
    _remaining_cluster_hosts: "{{ pool_overrides | selectattr('host', 'match', '^k8s-' + _cluster_name + '-.*') | list }}"
  when: _cluster_name | length > 0

- name: Delete API — check if API entry exists
  ansible.builtin.uri:
    url: "https://{{ pfsense_host }}/api/v2/services/dns_resolver/host_override"
    method: GET
    headers:
      x-api-key: "{{ pfsense_api_key }}"
    validate_certs: false
    return_content: yes
  register: api_check
  when:
    - _cluster_name | length > 0
    - _remaining_cluster_hosts | default([]) | length == 0

- name: Delete API — find API entry to delete
  ansible.builtin.set_fact:
    _api_entry: "{{ api_check.json.data | selectattr('host', 'equalto', 'k8s-' + _cluster_name + '-api') | selectattr('domain', 'equalto', target_item.domain) | list if api_check is not skipped else [] }}"

- name: Delete API — remove API DNS entry
  ansible.builtin.uri:
    url: "https://{{ pfsense_host }}/api/v2/services/dns_resolver/host_override"
    method: DELETE
    headers:
      x-api-key: "{{ pfsense_api_key }}"
    validate_certs: false
    status_code: [200]
    query:
      host: "k8s-{{ _cluster_name }}-api"
      domain: "{{ target_item.domain }}"
  when:
    - _cluster_name | length > 0
    - _remaining_cluster_hosts | default([]) | length == 0
    - _api_entry | length > 0

- name: Delete API — apply DNS resolver changes
  pfrest.pfsense.services_dns_resolver_apply:
    api_host: "{{ pfsense_host }}"
    api_key: "{{ pfsense_api_key }}"
    api_protocol: https
    validate_certs: false
  when:
    - _cluster_name | length > 0
    - _remaining_cluster_hosts | default([]) | length == 0
    - _api_entry | length > 0

- name: Delete API — display result
  ansible.builtin.debug:
    msg: "Deleted k8s-{{ _cluster_name }}-api.{{ target_item.domain }} (no remaining cluster hosts)"
  when:
    - _cluster_name | length > 0
    - _remaining_cluster_hosts | default([]) | length == 0
    - _api_entry | length > 0
