# ===========================================================================
# Ansible configuration (ansible.cfg)
#
# This file is read by every ansible-playbook / ansible command. Settings are
# looked up by section ([defaults], [ssh_connection], ...). CLI flags and
# environment variables override these values; this file is the base config.
# ===========================================================================

[defaults]
# gathering: "smart" only gathers facts the first time and reuses cached ones
# on later runs of the same playbook. "fact_caching" is where those facts
# persist between runs (jsonfile cache at /tmp/ansible_facts).
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts

# The SSH key and default user Ansible connects with. These are the fallback
# connection parameters; per-host values in the inventory override them.
private_key_file = ~/.ssh/id_rsa
remote_user = ansible

# Disable deprecation warnings to keep CI logs clean. inject_facts_as_vars =
# False stops Ansible from polluting the "vars" namespace with every fact,
# which avoids slow runs and accidental variable shadowing.
deprecation_warnings = False
inject_facts_as_vars = False

# remote_tmp is where Ansible executes its temp module payloads on the target
# (we force it into $HOME so it works even when /tmp is mounted noexec).
remote_tmp = $HOME/.ansible/tmp

# Where Ansible looks for installed collections (beyond the bundled ones).
# ansible-core ships no collections; community.* and pfrest.* are installed
# here via "ansible-galaxy collection install -r requirements.yaml".
collections_paths = ~/.ansible/collections:/usr/lib/python3/dist-packages/ansible_collections

# pipelining sends the module script over the existing SSH connection instead
# of a separate SFTP transfer — fewer round trips, much faster for many tasks.
pipelining = True

# timeout (seconds) is the SSH connection option that ALSO bounds the
# privilege-escalation (become/sudo) prompt wait: the become probe waits
# 2s + this timeout (ansible/plugins/connection/ssh.py) before giving up.
# It must live under [defaults]: the ssh plugin's duplicate ini key under
# [ssh_connection] is silently ignored in ansible-core 2.17 (measured
# 2026-08-09 — ConnectTimeout stayed 10 despite timeout=28 there), which is
# why the 12s default become cap kept killing freshly-joined nodes. With the
# default 10s, a freshly-joined node whose become probe needed ~13s while
# containerd pulled calico failed every run; 28s -> 30s become window = 2.3x
# the measured worst case, and it only bounds the wait for the prompt, so the
# success path (sudo answering in <1s when idle) is unaffected.
timeout = 28

[ssh_connection]
# Reuse one SSH connection for the whole play (ControlPersist=60s) so each
# task doesn't pay a fresh SSH handshake. Host key checking is disabled and
# the known_hosts file is /dev/null because VMs are ephemeral — the first run
# may legitimately see a new fingerprint.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
