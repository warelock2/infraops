name: Enforce Infrastructure as Code

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  terraform:
    runs-on: docker

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: master

      - name: Validate Infrastructure YAML
        uses: docker://python:3.12-alpine
        with:
          args: >
            sh -c "apk add -q yq &&
            pip install -q --upgrade --root-user-action=ignore pip &&
            pip install -q --root-user-action=ignore check-jsonschema &&
            check-jsonschema --schemafile config/infrastructure.schema.yaml
            config/infrastructure.yaml"

      - name: Generate Diagram
        uses: docker://python:3.12-alpine
        with:
          args: >
            sh -c "apk add -q yq &&
            pip install -q --upgrade --root-user-action=ignore pip &&
            pip install -q --root-user-action=ignore pyyaml &&
            python scripts/render-infra.py"

      - name: Terraform Init
        uses: docker://docker.localdomain:3000/warelock/ci-base:latest
        with:
          args: sh -c "cd terraform && terraform init"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://docker.localdomain:8200
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: Terraform Validate
        uses: docker://alpine/ansible:latest
        with:
          args: >
            sh -c "apk add --no-cache -q curl unzip yq &&
            TF_VERSION=$(yq .platform.terraform.version config/infrastructure.yaml) &&
            curl -sL https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip -o /tmp/terraform.zip &&
            unzip -oq /tmp/terraform.zip -d /usr/local/bin/ &&
            cd terraform &&
            terraform init &&
            terraform validate -no-color"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://docker.localdomain:8200
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: Terraform Plan
        uses: docker://alpine/ansible:latest
        with:
          args: >
            sh -c "apk add --no-cache -q curl unzip yq &&
            TF_VERSION=$(yq .platform.terraform.version config/infrastructure.yaml) &&
            curl -sL https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip -o /tmp/terraform.zip &&
            unzip -oq /tmp/terraform.zip -d /usr/local/bin/ &&
            cd terraform &&
            terraform init &&
            terraform plan -no-color -input=false"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://docker.localdomain:8200
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: K8s Drain Removed Nodes
        if: github.ref == 'refs/heads/master'
        uses: docker://alpine/ansible:latest
        with:
          args: >
            sh -c "
            apk add -q curl yq &&
            K8S_VERSION=$(yq .platform.kubernetes.version config/infrastructure.yaml) &&
            curl -sLO https://dl.k8s.io/release/v${K8S_VERSION}/bin/linux/amd64/kubectl &&
            chmod +x kubectl &&
            mv kubectl /usr/local/bin/ &&
            mkdir -p ~/.kube &&
            echo \"\$K8S_ADMIN_KUBECONFIG\" > ~/.kube/config &&
            chmod 600 ~/.kube/config &&
            ansible-playbook ansible/playbooks/k8s-drain-removed-nodes.yaml -i localhost,"
        env:
          K8S_ADMIN_KUBECONFIG: ${{ secrets.K8S_ADMIN_KUBECONFIG }}

      - name: Fix Terraform Dir Permissions
        if: github.ref == 'refs/heads/master'
        uses: docker://python:3.12-alpine
        with:
          args: sh -c "chmod -R a+rwx terraform/.terraform"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/master'
        uses: docker://deltamir/terraform-ansible:1.15.0
        with:
          args: >
            sh -c "
            pip install --break-system-packages hvac pfsense-vshell &&
            ansible-galaxy collection install pfrest.pfsense community.hashi_vault &&
            cd terraform &&
            terraform init -reconfigure &&
            terraform apply -auto-approve -no-color -input=false -parallelism=1"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://docker.localdomain:8200
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: K8s Generate Inventory
        if: github.ref == 'refs/heads/master'
        uses: docker://alpine/ansible:latest
        with:
          args: >
            sh -c "apk add --no-cache -q curl unzip yq &&
            TF_VERSION=$(yq .platform.terraform.version config/infrastructure.yaml) &&
            curl -sL https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip -o /tmp/terraform.zip &&
            unzip -oq /tmp/terraform.zip -d /usr/local/bin/ &&
            cd terraform &&
            terraform init -reconfigure &&
            terraform output -json ansible_inventory > ../ansible/inventory.json"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://docker.localdomain:8200
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: K8s Cluster Bootstrap
        if: github.ref == 'refs/heads/master'
        uses: docker://alpine/ansible:latest
        with:
          args: >
            sh -c 'apk add -q yq py3-pip &&
            pip3 install -q --break-system-packages --root-user-action=ignore hvac &&
            ansible-galaxy collection install
            kubernetes.core community.general ansible.posix
            community.hashi_vault pfrest.pfsense --force &&
            if [ -z "$ADMIN_SSH_PUBLIC_KEY" ]; then echo "ERROR: ADMIN_SSH_PUBLIC_KEY not set" && exit 1; fi &&
            if [ -z "$ANSIBLE_SSH_PRIVATE_KEY" ]; then echo "ERROR: ANSIBLE_SSH_PRIVATE_KEY not set" && exit 1; fi &&
            echo "$ADMIN_SSH_PUBLIC_KEY" > /tmp/ssh_key.pub &&
            echo "$ANSIBLE_SSH_PRIVATE_KEY" > /tmp/ansible_key &&
            chmod 600 /tmp/ansible_key &&
            export ANSIBLE_CONFIG=$PWD/ansible/ansible.cfg &&
            SERVICE_HOST=$(yq .defaults.service_host config/infrastructure.yaml) &&
            DNS_DOMAIN=$(yq .platform.proxmox.dns_domain config/infrastructure.yaml) &&
            SERVICE_DOMAIN="${SERVICE_HOST}.${DNS_DOMAIN}" &&
            ansible-playbook -i ansible/inventory.json ansible/playbooks/k8s-cluster.yaml
            --private-key /tmp/ansible_key
            -e infra_platform_kubernetes_version=$(yq .platform.kubernetes.version config/infrastructure.yaml)
            -e infra_platform_kubernetes_pod_network_cidr=$(yq .platform.kubernetes.pod_network_cidr config/infrastructure.yaml)
            -e infra_platform_kubernetes_calico_version=$(yq .platform.kubernetes.calico_version config/infrastructure.yaml)
            -e infra_service_domain=$SERVICE_DOMAIN
            -e infra_admin_user=$(yq .platform.admin.user config/infrastructure.yaml)
            -e infra_admin_group=$(yq .platform.admin.group config/infrastructure.yaml)
            -e infra_ssh_key_file=/tmp/ssh_key.pub'
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          ADMIN_SSH_PUBLIC_KEY: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}
