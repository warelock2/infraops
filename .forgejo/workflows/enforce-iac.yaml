# ===========================================================================
# enforce-iac.yaml — the main infrastructure reconciliation pipeline.
#
# Runs on every push to master and via manual dispatch. It walks the whole
# IaC loop against the single source of truth (conf/infrastructure.yaml):
#
#   1. Validate the YAML against its JSON Schema (fail fast on typos).
#   2. Terraform init/validate/plan — the plan's exit code (0/1/2) tells us
#      if infra CHANGED (2 = real diff) and gates the apply below.
#   3. Pre-apply housekeeping: drain k8s nodes no longer in the config, and
#      ensure the NATS readiness consumer exists.
#   4. Apply + wait for readiness (terraform-apply-with-readiness.sh):
#      only the VMs this plan CREATES/REPLACES signal on NATS. The step
#      outputs ready=true ONLY when every expected VM answered — the hard
#      gate before Ansible config-management runs. It also stamps the "iac"
#      state-drift tag on every VM the plan changed (create/replace/update).
#   5. Clean DNS (restart-pfsense-dhcp.sh): verify every provisioned VM
#      resolves only to in-pool IPs, and when a boot-window ghost lease left
#      a stale registration, delete the ghost lease FIRST then restart pfSense
#      DHCP so Unbound is rebuilt clean — Ansible never sees polluted DNS.
#   6. Wake active nodes (reconcile-standby-nodes.sh --wake): a PROMOTION
#      run changes only the active/standby split (nodes +k, standby -k, total
#      flat), which Terraform sees as no diff — yet the promoted ghost must
#      be booted before Ansible touches it. This starts every stopped active
#      VM and clears the "standby" tag from actives.
#   7. Generate the Ansible inventory and run site.yaml (k8s-cluster plays).
#      Ansible stamps "iac" on the hosts its recap reports as changed.
#   8. Build and park standby nodes (build-and-park-standby.sh): running
#      ghosts are built like any other node (common baseline + k8s base
#      toolchain) then parked — clean shutdown + standby tag. Standby VMs are
#      deliberately iac-invisible: Terraform never stamps them and this step
#      emits no drift.
#   9. LAST STEP, Clear IaC Tags: removes "iac" from the UNION of the
#      Terraform-drifted and Ansible-drifted host sets only — any other
#      tagged host is left alone. No if: gate: fail-fast means reaching it
#      implies the whole run succeeded.
#
# The many `if:` conditions on `steps.apply-wait.outputs.ready == 'true'`
# are what guarantee Ansible never touches a half-booted VM.
#
# NOTE: the workflow runs inside the forgejo-runner's docker_dind daemon as
# the ci-base image (see scripts/build-ci-base.sh). All steps are containers.
# ===========================================================================
name: Enforce Infrastructure as Code

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  terraform:
    runs-on: docker

    steps:
      - name: Checkout
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        env:
          GIT_SSL_NO_VERIFY: "1"
        with:
          args: >
            sh -c "git clone --depth 1 --branch master
            https://docker.localdomain:3000/warelock/infraops.git
            /tmp/repo && cp -r /tmp/repo/.
            /workspace/warelock/infraops/ &&
            rm -f .iac-timings.log &&
            sh scripts/record-timing.sh checkout"

      - name: Validate Infrastructure YAML
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "sh scripts/record-timing.sh validate &&
            check-jsonschema --schemafile conf/infrastructure.schema.yaml
            conf/infrastructure.yaml"

      - name: Generate Diagram
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "python scripts/render-infra.py"

      - name: Terraform Init
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: sh -c "sh scripts/terraform-init-retry.sh -chdir=terraform init"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: Terraform Validate
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: sh -c "sh scripts/terraform-init-retry.sh -chdir=terraform init && terraform -chdir=terraform validate -no-color"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: K8s Drain Removed Nodes
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "
            K8S_DOMAIN=\$(yq .platform.proxmox.dns_domain conf/infrastructure.yaml) &&
            CP01=\$(yq -r '.clusters[0].name' conf/infrastructure.yaml) &&
            CP_FQDN=k8s-\${CP01}-control-01.\${K8S_DOMAIN} &&
            if ! python3 -c 'import socket,sys; s=socket.create_connection((sys.argv[1], 22), 5); s.close()' \"\${CP_FQDN}\" >/dev/null 2>&1; then
              echo \"\${CP_FQDN} control plane not reachable on port 22 - no existing cluster to drain (new/destroyed cluster); skipping\";
              exit 0;
            fi &&
            mkdir -p ~/.kube &&
            echo \"\$ANSIBLE_SSH_PRIVATE_KEY\" > /tmp/ansible_key &&
            chmod 600 /tmp/ansible_key &&
            if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i /tmp/ansible_key ansible@\${CP_FQDN} 'test -f /etc/kubernetes/admin.conf' 2>/dev/null; then
              echo \"\${CP_FQDN} reachable but not bootstrapped (no admin.conf) - no cluster to drain; skipping\";
              exit 0;
            fi &&
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i /tmp/ansible_key ansible@\${CP_FQDN} 'sudo cat /etc/kubernetes/admin.conf' > ~/.kube/config &&
            chmod 600 ~/.kube/config &&
            ansible-playbook ansible/playbooks/k8s-drain-removed-nodes.yaml -i localhost,"
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}

      - name: DNS Consistency Enforcement
        id: dns-enforce
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: sh scripts/enforce-dns-consistency.sh
        env:
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

- name: Terraform Plan
        id: plan
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "sh scripts/record-timing.sh plan &&
            sh scripts/terraform-init-retry.sh -chdir=terraform init &&
            terraform -chdir=terraform plan -detailed-exitcode -no-color -input=false > /tmp/plan_output.txt 2>&1; echo \"plan_exit=\$?\" >> \$GITHUB_OUTPUT; cat /tmp/plan_output.txt"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: Check for Infrastructure Changes
        id: changes
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "PLAN_EXIT=\${PLAN_EXIT:-2} &&
            if [ \"\$PLAN_EXIT\" = \"2\" ]; then
              echo 'changed=true' >> \$GITHUB_OUTPUT
            else
              echo 'changed=false' >> \$GITHUB_OUTPUT
            fi &&
            echo \"Infrastructure changes detected: \$( [ \"\$PLAN_EXIT\" = \"2\" ] && echo true || echo false)\""
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.plan_exit }}

      - name: Check Clusters
        id: clusters
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "CLUSTERS=$(yq '.clusters | length' conf/infrastructure.yaml) &&
            echo \"has_clusters=$([ \"$CLUSTERS\" -gt 0 ] && echo true || echo false)\" >> $GITHUB_OUTPUT &&
            CM_TAGGED=$(yq '[.clusters[]?.enforcement[], .hosts[]?.enforcement[]] | any_c(. == \"configuration_management\")' conf/infrastructure.yaml) &&
            echo \"has_config_management=$CM_TAGGED\" >> $GITHUB_OUTPUT"

      - name: Fix Terraform Dir Permissions
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: sh -c "chmod -R a+rwx terraform/.terraform"

      - name: Ensure Readiness Poller Consumer Exists
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: sh scripts/ensure-readiness-poller.sh
        env:
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      # ---------------------------------------------------------------------
      # THE GATE. This step is the orchestrator: it plans (to a file so the
      # script can inspect create/replace actions), applies, then blocks on
      # the NATS readiness stream for exactly the VMs it created. Only when
      # every expected VM has signalled does it emit ready=true. If a VM
      # never answers, it's destroyed and the apply retried (MAX_RETRIES).
      # The Ansible steps below are gated on ready == 'true'.
      # ---------------------------------------------------------------------
      - name: Apply and Wait for Readiness (with retries)
        id: apply-wait
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "sh scripts/record-timing.sh apply &&
            sh scripts/terraform-apply-with-readiness.sh"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      # ---------------------------------------------------------------------
      # DHCP/DNS cleanup before Ansible touches anything. A freshly cloned VM
      # holds a short DHCP lease during its boot window; the VM now releases
      # it during the DHCP->static switch (cloud-init runcmd), but the stale
      # DNS registration survives until the DHCP service restarts and
      # dhcpleases rewrites Unbound. This step verifies every provisioned VM
      # resolves only to in-pool IPs, and when out-of-pool "ghost" answers
      # exist it DELETES those leases FIRST (stop dhcpd -> sed the lease
      # block) and THEN restarts DHCP so Unbound is rebuilt against a clean
      # leases file, then re-verifies. It only fails if a ghost persists
      # after deletion, so Ansible below never runs against polluted DNS.
      # ---------------------------------------------------------------------
      - name: Delete Ghost DHCP Leases and Restart pfSense DHCP
        if: github.ref == 'refs/heads/master' && steps.apply-wait.outputs.ready == 'true'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "sh scripts/record-timing.sh dns-clean &&
            sh scripts/restart-pfsense-dhcp.sh"
        env:
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      # ---------------------------------------------------------------------
      # Enforce the active/standby partition before config management. On a
      # PROMOTION run (nodes +k, standby -k — total flat) Terraform sees no
      # diff, yet the promoted ghost must be booted before Ansible tries to
      # reach it. This step starts every active VM that is currently stopped
      # and clears the "standby" tag from actives (heals manually-stopped
      # nodes too). No-op when nothing needs starting.
      # ---------------------------------------------------------------------
      - name: Wake Active Nodes (reconcile standby)
        if: github.ref == 'refs/heads/master' && steps.clusters.outputs.has_clusters == 'true' && steps.apply-wait.outputs.ready == 'true'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: sh scripts/reconcile-standby-nodes.sh --wake
        env:
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      # ---------------------------------------------------------------------
      # Config management only runs when the readiness gate passed AND at
      # least one entity (cluster or host) is tagged configuration_management
      # in infrastructure.yaml. The inventory is generated from that file,
      # then site.yaml (common baseline + k8s-cluster plays) configures the
      # hosts over SSH with keys passed in via secrets. Because of the gate,
      # the plays assume manageable hosts — no boot-polling, just config.
      # ---------------------------------------------------------------------
      - name: Generate Ansible Inventory
        if: github.ref == 'refs/heads/master' && steps.clusters.outputs.has_config_management == 'true' && steps.apply-wait.outputs.ready == 'true'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "python3 scripts/generate-inventory.py --output ansible/inventory.json"

      - name: Configuration Management
        id: config-mgmt
        if: github.ref == 'refs/heads/master' && steps.clusters.outputs.has_config_management == 'true' && steps.apply-wait.outputs.ready == 'true'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "sh scripts/record-timing.sh config-mgmt &&
            sh scripts/configuration-management.sh"
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          ADMIN_SSH_PUBLIC_KEY: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      # ---------------------------------------------------------------------
      # Build and park standby VMs. Runs AFTER config management (normal nodes
      # are done first). Only freshly-created standby VMs are running; parked
      # ones are stopped and skipped. Running ghosts are built like any other
      # node (common baseline + k8s base toolchain) then parked via
      # reconcile-standby-nodes.sh --park (clean shutdown + standby tag).
      # No-op when no standby VMs exist or none are running.
      # ---------------------------------------------------------------------
      - name: Build and Park Standby Nodes
        if: github.ref == 'refs/heads/master' && steps.clusters.outputs.has_clusters == 'true' && steps.apply-wait.outputs.ready == 'true'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "sh scripts/record-timing.sh build-park &&
            sh scripts/build-and-park-standby.sh"
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          ADMIN_SSH_PUBLIC_KEY: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      # ---------------------------------------------------------------------
      # Clear the "iac" state-drift tag from EXACTLY the hosts that drifted
      # this run: the union of the VMs Terraform changed (apply-wait output
      # terraform_drifted) and the hosts Ansible config management changed
      # (config-mgmt output ansible_drifted). Any OTHER host still carrying
      # the tag (e.g. from an earlier failed run) is left alone - it was not
      # touched this run.
      #
      # This is deliberately the LAST step with NO if: gate. Fail-fast means
      # reaching this step already implies the whole run (apply + readiness +
      # config management) succeeded, so a failed run leaves the tags in place
      # and the drifted hosts stay visible in the Proxmox UI. On non-master
      # manual dispatches apply-wait and config-mgmt are skipped, so both
      # inputs are empty and this step is a no-op.
      # ---------------------------------------------------------------------
      - name: Clear IaC Tags
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "sh scripts/record-timing.sh clear-tags &&
            sh scripts/clear-iac-tags.sh"
        env:
          TERRAFORM_DRIFTED: ${{ steps.apply-wait.outputs.terraform_drifted }}
          ANSIBLE_DRIFTED: ${{ steps.config-mgmt.outputs.ansible_drifted }}
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: Report Timings
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: sh scripts/report-timings.sh
