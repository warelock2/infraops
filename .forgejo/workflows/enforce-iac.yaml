# ===========================================================================
# enforce-iac.yaml — the main infrastructure reconciliation pipeline.
#
# Runs on every push to master and via manual dispatch. It walks the whole
# IaC loop against the single source of truth (conf/infrastructure.yaml):
#
#   1. Validate the YAML against its JSON Schema (fail fast on typos).
#   2. Terraform init/validate/plan — the plan's exit code (0/1/2) tells us
#      if infra CHANGED (2 = real diff) and gates the apply below.
#   3. Pre-apply housekeeping: drain k8s nodes no longer in the config, and
#      ensure the NATS readiness consumer exists.
#   4. Apply + wait for readiness (terraform-apply-with-readiness.sh):
#      only the VMs this plan CREATES/REPLACES signal on NATS. The step
#      outputs ready=true ONLY when every expected VM answered — the hard
#      gate before Ansible config-management runs.
#   5. Generate the Ansible inventory and run site.yaml (k8s-cluster plays).
#
# The many `if:` conditions on `steps.apply-wait.outputs.ready == 'true'`
# are what guarantee Ansible never touches a half-booted VM.
#
# NOTE: the workflow runs inside the forgejo-runner's docker_dind daemon as
# the ci-base image (see scripts/build-ci-base.sh). All steps are containers.
# ===========================================================================
name: Enforce Infrastructure as Code

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  terraform:
    runs-on: docker

    steps:
      - name: Checkout
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        env:
          GIT_SSL_NO_VERIFY: "1"
        with:
          args: >
            sh -c "git clone --depth 1 --branch master
            https://docker.localdomain:3000/warelock/infraops.git
            /tmp/repo && cp -r /tmp/repo/.
            /workspace/warelock/infraops/"

      - name: Validate Infrastructure YAML
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "check-jsonschema --schemafile conf/infrastructure.schema.yaml
            conf/infrastructure.yaml"

      - name: Generate Diagram
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "python scripts/render-infra.py"

      - name: Terraform Init
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: sh -c "sh scripts/terraform-init-retry.sh -chdir=terraform init"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: Terraform Validate
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: sh -c "sh scripts/terraform-init-retry.sh -chdir=terraform init && terraform -chdir=terraform validate -no-color"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: Terraform Plan
        id: plan
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "sh scripts/terraform-init-retry.sh -chdir=terraform init && set +e;
            terraform -chdir=terraform plan -detailed-exitcode -no-color -input=false > /tmp/plan_output.txt 2>&1;
            PLAN_EXIT=\$?;
            set -e;
            echo \"plan_exit=\$PLAN_EXIT\" >> \$GITHUB_OUTPUT && cat /tmp/plan_output.txt"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: Check for Infrastructure Changes
        id: changes
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "PLAN_EXIT=\${PLAN_EXIT:-0} &&
            if [ \"\$PLAN_EXIT\" = \"2\" ]; then
              echo 'changed=true' >> \$GITHUB_OUTPUT
            else
              echo 'changed=false' >> \$GITHUB_OUTPUT
            fi &&
            echo \"Infrastructure changes detected: \$(echo \$PLAN_EXIT | grep -q 2 && echo true || echo false)\""
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.plan_exit }}

      - name: Check Clusters
        id: clusters
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "CLUSTERS=$(yq '.clusters | length' conf/infrastructure.yaml) &&
            echo \"has_clusters=$([ \"$CLUSTERS\" -gt 0 ] && echo true || echo false)\" >> $GITHUB_OUTPUT &&
            CM_TAGGED=$(yq '[.clusters[]?.enforcement[], .hosts[]?.enforcement[]] | any_c(. == \"configuration_management\")' conf/infrastructure.yaml) &&
            echo \"has_config_management=$CM_TAGGED\" >> $GITHUB_OUTPUT"

      - name: K8s Drain Removed Nodes
        if: github.ref == 'refs/heads/master' && steps.clusters.outputs.has_clusters == 'true'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "
            mkdir -p ~/.kube &&
            echo \"\$ANSIBLE_SSH_PRIVATE_KEY\" > /tmp/ansible_key &&
            chmod 600 /tmp/ansible_key &&
            K8S_DOMAIN=\$(yq .platform.proxmox.dns_domain conf/infrastructure.yaml) &&
            CP01=\$(yq -r '.clusters[0].name' conf/infrastructure.yaml) &&
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/ansible_key ansible@k8s-\${CP01}-control-01.\${K8S_DOMAIN} 'sudo cat /etc/kubernetes/admin.conf' > ~/.kube/config &&
            chmod 600 ~/.kube/config &&
            ansible-playbook ansible/playbooks/k8s-drain-removed-nodes.yaml -i localhost,"
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}

      - name: Fix Terraform Dir Permissions
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: sh -c "chmod -R a+rwx terraform/.terraform"

      - name: Ensure Readiness Poller Consumer Exists
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: sh scripts/ensure-readiness-poller.sh
        env:
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      # ---------------------------------------------------------------------
      # THE GATE. This step is the orchestrator: it plans (to a file so the
      # script can inspect create/replace actions), applies, then blocks on
      # the NATS readiness stream for exactly the VMs it created. Only when
      # every expected VM has signalled does it emit ready=true. If a VM
      # never answers, it's destroyed and the apply retried (MAX_RETRIES).
      # The Ansible steps below are gated on ready == 'true'.
      # ---------------------------------------------------------------------
      - name: Apply and Wait for Readiness (with retries)
        id: apply-wait
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: sh scripts/terraform-apply-with-readiness.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      # ---------------------------------------------------------------------
      # Config management only runs when the readiness gate passed AND at
      # least one entity (cluster or host) is tagged configuration_management
      # in infrastructure.yaml. The inventory is generated from that file,
      # then site.yaml (common baseline + k8s-cluster plays) configures the
      # hosts over SSH with keys passed in via secrets. Because of the gate,
      # the plays assume manageable hosts — no boot-polling, just config.
      # ---------------------------------------------------------------------
      - name: Generate Ansible Inventory
        if: github.ref == 'refs/heads/master' && steps.clusters.outputs.has_config_management == 'true' && steps.apply-wait.outputs.ready == 'true'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "python3 scripts/generate-inventory.py --output ansible/inventory.json"

      - name: Configuration Management
        if: github.ref == 'refs/heads/master' && steps.clusters.outputs.has_config_management == 'true' && steps.apply-wait.outputs.ready == 'true'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c '
            if [ -z "$ADMIN_SSH_PUBLIC_KEY" ]; then echo "ERROR: ADMIN_SSH_PUBLIC_KEY not set" && exit 1; fi &&
            if [ -z "$ANSIBLE_SSH_PRIVATE_KEY" ]; then echo "ERROR: ANSIBLE_SSH_PRIVATE_KEY not set" && exit 1; fi &&
            export VAULT_ADDR=https://vault.afobl.com &&
            export VAULT_SKIP_VERIFY=true &&
            NTFY_CHANNEL=$(vault kv get -field=message_channel_phone secret/infraops/ntfy) &&
            K8S_VERSION=$(yq .platform.kubernetes.version conf/infrastructure.yaml) &&
            BAKED_KUBECTL=$(kubectl version --client -o yaml | yq .clientVersion.gitVersion) &&
            case "$BAKED_KUBECTL" in *"$K8S_VERSION"*) ;; *)
              echo "ERROR: config k8s version $K8S_VERSION != baked kubectl $BAKED_KUBECTL; rebuild ci-base (KUBECTL_VERSION ARG)" && exit 1;;
            esac &&
            echo "$ADMIN_SSH_PUBLIC_KEY" > /tmp/ssh_key.pub &&
            echo "$ANSIBLE_SSH_PRIVATE_KEY" > /tmp/ansible_key &&
            chmod 600 /tmp/ansible_key &&
            mkdir -p ~/.kube &&
            DNS_DOMAIN=$(yq .platform.proxmox.dns_domain conf/infrastructure.yaml) &&
            if [ "$(yq '.clusters | length' conf/infrastructure.yaml)" -gt 0 ]; then CP01=$(yq -r '.clusters[0].name' conf/infrastructure.yaml) && ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/ansible_key ansible@k8s-${CP01}-control-01.${DNS_DOMAIN} sudo cat /etc/kubernetes/admin.conf > ~/.kube/config && chmod 600 ~/.kube/config; else echo "No clusters in infrastructure.yaml - skipping kubeconfig fetch"; fi &&
            export ANSIBLE_CONFIG=$PWD/ansible/ansible.cfg &&
            SERVICE_HOST=$(yq .defaults.service_host conf/infrastructure.yaml) &&
            DNS_DOMAIN=$(yq .platform.proxmox.dns_domain conf/infrastructure.yaml) &&
            SERVICE_DOMAIN="${SERVICE_HOST}.${DNS_DOMAIN}" &&
            GIT_COMMIT="${GITHUB_SHA::8}" &&
            GIT_TAG="${GITHUB_REF_NAME}" &&
            ansible-playbook -i ansible/inventory.json ansible/playbooks/site.yaml
            --private-key /tmp/ansible_key
            -e infra_platform_kubernetes_version=$(yq .platform.kubernetes.version conf/infrastructure.yaml)
            -e infra_platform_kubernetes_pod_network_cidr=$(yq .platform.kubernetes.pod_network_cidr conf/infrastructure.yaml)
            -e infra_platform_kubernetes_calico_version=$(yq .platform.kubernetes.calico_version conf/infrastructure.yaml)
            -e infra_service_domain=$SERVICE_DOMAIN
            -e infra_admin_user=$(yq .platform.admin.user conf/infrastructure.yaml)
            -e infra_admin_group=$(yq .platform.admin.group conf/infrastructure.yaml)
            -e infra_ssh_key_file=/tmp/ssh_key.pub
            -e git_commit=$GIT_COMMIT
            -e git_tag=$GIT_TAG
            -e ntfy_message_channel=$NTFY_CHANNEL'
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          ADMIN_SSH_PUBLIC_KEY: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}
