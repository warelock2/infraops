name: Enforce Infrastructure as Code

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  terraform:
    runs-on: docker

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: master

      - name: Validate Infrastructure YAML
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "check-jsonschema --schemafile config/infrastructure.schema.yaml
            config/infrastructure.yaml"

      - name: Generate Diagram
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "python scripts/render-infra.py"

      - name: Terraform Init
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: sh -c "cd terraform && terraform init"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: Terraform Validate
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: sh -c "cd terraform && terraform init && terraform validate -no-color"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: Terraform Plan
        id: plan
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "cd terraform && terraform init && set +e;
            terraform plan -detailed-exitcode -no-color -input=false > /tmp/plan_output.txt 2>&1;
            PLAN_EXIT=\$?;
            set -e;
            echo \"plan_exit=\$PLAN_EXIT\" >> \$GITHUB_OUTPUT && cat /tmp/plan_output.txt"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: Check for Infrastructure Changes
        id: changes
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "PLAN_EXIT=\${PLAN_EXIT:-0} &&
            if [ \"\$PLAN_EXIT\" = \"2\" ]; then
              echo 'changed=true' >> \$GITHUB_OUTPUT
            else
              echo 'changed=false' >> \$GITHUB_OUTPUT
            fi &&
            echo \"Infrastructure changes detected: \$(echo \$PLAN_EXIT | grep -q 2 && echo true || echo false)\""
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.plan_exit }}

      - name: Check Clusters
        id: clusters
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "CLUSTERS=$(yq '.clusters | length' config/infrastructure.yaml) &&
            echo \"has_clusters=$([ \"$CLUSTERS\" -gt 0 ] && echo true || echo false)\" >> $GITHUB_OUTPUT"

      - name: K8s Drain Removed Nodes
        if: github.ref == 'refs/heads/master' && steps.clusters.outputs.has_clusters == 'true'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "
            K8S_VERSION=$(yq .platform.kubernetes.version config/infrastructure.yaml) &&
            curl -sLO https://dl.k8s.io/release/v${K8S_VERSION}/bin/linux/amd64/kubectl &&
            chmod +x kubectl &&
            mv kubectl /usr/local/bin/ &&
            mkdir -p ~/.kube &&
            echo \"\$K8S_ADMIN_KUBECONFIG\" > ~/.kube/config &&
            chmod 600 ~/.kube/config &&
            ansible-playbook ansible/playbooks/k8s-drain-removed-nodes.yaml -i localhost,"
        env:
          K8S_ADMIN_KUBECONFIG: ${{ secrets.K8S_ADMIN_KUBECONFIG }}

      - name: Fix Terraform Dir Permissions
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: sh -c "chmod -R a+rwx terraform/.terraform"

      - name: Ensure Readiness Poller Consumer Exists
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c '
            set -e

            echo "=== Reading NATS password from Vault ==="
            export VAULT_ADDR="https://vault.afobl.com"
            export VAULT_SKIP_VERIFY="true"
            export VAULT_TOKEN="${{ secrets.VAULT_RO_TOKEN }}"
            NATS_IAC_PASSWORD=$(vault kv get -format=json secret/infraops/nats | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['data']['iac_orchestrator_password'])")

            echo "=== Setting up nats context ==="
            nats context add iac-orchestrator \
              --server tls://midas.afobl.com:4222 \
              --user iac-orchestrator --password "$NATS_IAC_PASSWORD"

            echo "=== Ensuring readiness-poller consumer exists ==="
            nats consumer add infraops readiness-poller \
              --pull --ack=explicit --deliver=all \
              --filter="infraops.helloworld" \
              --replay=instant --max-deliver=-1 --max-pending=-1 \
              --defaults --context=iac-orchestrator
            '

      - name: Terraform Apply
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "cd terraform &&
            terraform init -reconfigure &&
            terraform apply -auto-approve -no-color -input=false -parallelism=1"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: Wait for VM Readiness Signals
        if: github.ref == 'refs/heads/master'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c '
            set -e

            echo "=== Reading NATS password from Vault ==="
            export VAULT_ADDR="https://vault.afobl.com"
            export VAULT_SKIP_VERIFY="true"
            NATS_IAC_PASSWORD=$(vault kv get -format=json secret/infraops/nats | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['data']['iac_orchestrator_password'])")

            echo "=== Setting up nats context ==="
            nats context add iac-orchestrator \
              --server tls://midas.afobl.com:4222 \
              --user iac-orchestrator --password "$NATS_IAC_PASSWORD"

            echo "=== Computing expected VMs ==="
            EXPECTED_VMS=""
            CLUSTER_COUNT=$(yq ".clusters | length" config/infrastructure.yaml)
            for i in $(seq 0 $((CLUSTER_COUNT - 1))); do
              CLUSTER_NAME=$(yq ".clusters[$i].name" config/infrastructure.yaml)
              CLUSTER_TYPE=$(yq ".clusters[$i].cluster_type // .defaults.cluster_type" config/infrastructure.yaml)
              CP_NODES=$(yq ".clusters[$i].control_plane.nodes // 0" config/infrastructure.yaml)
              WORKER_NODES=$(yq ".clusters[$i].workers.nodes // 0" config/infrastructure.yaml)
              CP_PLANE_NAME=$(yq ".clusters[$i].plane_defaults.control_plane.plane_name // .defaults.planes.control_plane.plane_name" config/infrastructure.yaml)
              WORKER_PLANE_NAME=$(yq ".clusters[$i].plane_defaults.workers.plane_name // .defaults.planes.workers.plane_name" config/infrastructure.yaml)
              CP_VM_ID_START=$(yq ".clusters[$i].control_plane.vm_id_start" config/infrastructure.yaml)
              WORKER_VM_ID_START=$(yq ".clusters[$i].workers.vm_id_start" config/infrastructure.yaml)
              for n in $(seq 1 $CP_NODES); do
                NUM=$(printf "%02d" $n)
                HOSTNAME="${CLUSTER_TYPE}-${CLUSTER_NAME}-${CP_PLANE_NAME}-${NUM}"
                VMID=$((CP_VM_ID_START + n - 1))
                EXPECTED_VMS="${EXPECTED_VMS}${HOSTNAME}:${VMID} "
              done
              for n in $(seq 1 $WORKER_NODES); do
                NUM=$(printf "%02d" $n)
                HOSTNAME="${CLUSTER_TYPE}-${CLUSTER_NAME}-${WORKER_PLANE_NAME}-${NUM}"
                VMID=$((WORKER_VM_ID_START + n - 1))
                EXPECTED_VMS="${EXPECTED_VMS}${HOSTNAME}:${VMID} "
              done
            done

            echo "Expected VMs: $EXPECTED_VMS"
            TOTAL=$(echo "$EXPECTED_VMS" | wc -w)
            echo "Total VMs: $TOTAL"

            echo "=== Polling for readiness signals (20 min timeout) ==="
            READY_VMS=""
            START_TIME=$(date +%s)
            TIMEOUT=1200

            while true; do
              ELAPSED=$(( $(date +%s) - START_TIME ))
              if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
                echo "TIMEOUT after ${TIMEOUT}s"
                break
              fi

              REMAINING=$((TIMEOUT - ELAPSED))
              echo "--- Poll cycle (${ELAPSED}s elapsed, ${REMAINING}s remaining) ---"

              # Check for new messages
              while MSG=$(nats consumer next infraops readiness-poller --context=iac-orchestrator --wait=2s 2>/dev/null); do
                HOSTNAME=$(echo "$MSG" | python3 -c "import sys,json; print(json.load(sys.stdin).get(\"hostname\",\"\"))" 2>/dev/null || true)
                if [ -n "$HOSTNAME" ] && echo "$READY_VMS" | grep -q "$HOSTNAME"; then
                  continue
                fi
                if [ -n "$HOSTNAME" ]; then
                  echo "READY: $HOSTNAME"
                  READY_VMS="$READY_VMS $HOSTNAME"
                fi
              done || true

              # Check if all VMs are ready
              ALL_READY=true
              for entry in $EXPECTED_VMS; do
                HOSTNAME="${entry%%:*}"
                if ! echo "$READY_VMS" | grep -qw "$HOSTNAME"; then
                  ALL_READY=false
                  break
                fi
              done

              if [ "$ALL_READY" = "true" ]; then
                echo "ALL VMs READY"
                echo "ready=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              NOT_READY=""
              for entry in $EXPECTED_VMS; do
                HOSTNAME="${entry%%:*}"
                if ! echo "$READY_VMS" | grep -qw "$HOSTNAME"; then
                  NOT_READY="$NOT_READY $HOSTNAME"
                fi
              done
              echo "Not ready yet:$NOT_READY"
              sleep 10
            done

            echo "TIMEOUT: some VMs did not declare readiness"
            echo "ready=false" >> "$GITHUB_OUTPUT"

            # Identify failed VMs and their VMIDs
            FAILED_VMS=""
            for entry in $EXPECTED_VMS; do
              HOSTNAME="${entry%%:*}"
              VMID="${entry##*:}"
              if ! echo "$READY_VMS" | grep -qw "$HOSTNAME"; then
                echo "FAILED: $HOSTNAME (VMID $VMID)"
                FAILED_VMS="$FAILED_VMS $HOSTNAME:$VMID"
              fi
            done
            echo "failed_vms=$FAILED_VMS" >> "$GITHUB_OUTPUT"
            exit 1
            '

      - name: Destroy Failed VMs
        if: github.ref == 'refs/heads/master' && failure() && steps.wait-for-signals.outputs.ready == 'false'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c '
            set -e
            echo "=== Reading Proxmox credentials from Vault ==="
            export VAULT_ADDR="https://vault.afobl.com"
            export VAULT_SKIP_VERIFY="true"
            export VAULT_TOKEN="${{ secrets.VAULT_RO_TOKEN }}"

            PROXMOX_ENDPOINT=$(vault kv get -format=json secret/infraops/proxmox | python3 -c "import sys,json; print(json.load(sys.stdin)[\"data\"][\"data\"][\"endpoint\"])")
            PROXMOX_TOKEN=$(vault kv get -format=json secret/infraops/proxmox | python3 -c "import sys,json; print(json.load(sys.stdin)[\"data\"][\"data\"][\"api_token\"])")
            PROXMOX_NODE=$(yq .platform.proxmox.node config/infrastructure.yaml)

            echo "Endpoint: $PROXMOX_ENDPOINT"
            echo "Node: $PROXMOX_NODE"

            FAILED_VMS="${{ steps.wait-for-signals.outputs.failed_vms }}"
            for entry in $FAILED_VMS; do
              HOSTNAME="${entry%%:*}"
              VMID="${entry##*:}"
              echo "Destroying $HOSTNAME (VMID $VMID)..."
              HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" \
                -X DELETE \
                -H "Authorization: PVEAPIToken=${PROXMOX_TOKEN}" \
                "${PROXMOX_ENDPOINT}/nodes/${PROXMOX_NODE}/qemu/${VMID}")
              echo "  HTTP $HTTP_CODE"
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
                echo "  $HOSTNAME destroyed"
              else
                echo "  WARNING: unexpected HTTP $HTTP_CODE"
              fi
            done

            echo "=== Re-applying Terraform to recreate destroyed VMs ==="
            cd terraform
            terraform init -reconfigure
            terraform apply -auto-approve -no-color -input=false -parallelism=1
            '
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VAULT_ADDR: https://vault.afobl.com
          VAULT_SKIP_VERIFY: "true"
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}

      - name: Generate Ansible Inventory
        if: github.ref == 'refs/heads/master' && steps.clusters.outputs.has_clusters == 'true'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c "python3 scripts/generate-inventory.py --output ansible/inventory.json"

      - name: Configuration Management
        if: github.ref == 'refs/heads/master' && steps.clusters.outputs.has_clusters == 'true'
        uses: docker://forgejo.afobl.com/warelock/ci-base:latest
        with:
          args: >
            sh -c '
            K8S_VERSION=$(yq .platform.kubernetes.version config/infrastructure.yaml) &&
            curl -sLO https://dl.k8s.io/release/v${K8S_VERSION}/bin/linux/amd64/kubectl &&
            chmod +x kubectl &&
            mv kubectl /usr/local/bin/ &&
            if [ -z "$ADMIN_SSH_PUBLIC_KEY" ]; then echo "ERROR: ADMIN_SSH_PUBLIC_KEY not set" && exit 1; fi &&
            if [ -z "$ANSIBLE_SSH_PRIVATE_KEY" ]; then echo "ERROR: ANSIBLE_SSH_PRIVATE_KEY not set" && exit 1; fi &&
            echo "$ADMIN_SSH_PUBLIC_KEY" > /tmp/ssh_key.pub &&
            echo "$ANSIBLE_SSH_PRIVATE_KEY" > /tmp/ansible_key &&
            chmod 600 /tmp/ansible_key &&
            export ANSIBLE_CONFIG=$PWD/ansible/ansible.cfg &&
            SERVICE_HOST=$(yq .defaults.service_host config/infrastructure.yaml) &&
            DNS_DOMAIN=$(yq .platform.proxmox.dns_domain config/infrastructure.yaml) &&
            SERVICE_DOMAIN="${SERVICE_HOST}.${DNS_DOMAIN}" &&
            GIT_COMMIT="${GITHUB_SHA::8}" &&
            GIT_TAG="${GITHUB_REF_NAME}" &&
            ansible-playbook -i ansible/inventory.json ansible/playbooks/site.yaml
            --private-key /tmp/ansible_key
            -e infra_platform_kubernetes_version=$(yq .platform.kubernetes.version config/infrastructure.yaml)
            -e infra_platform_kubernetes_pod_network_cidr=$(yq .platform.kubernetes.pod_network_cidr config/infrastructure.yaml)
            -e infra_platform_kubernetes_calico_version=$(yq .platform.kubernetes.calico_version config/infrastructure.yaml)
            -e infra_service_domain=$SERVICE_DOMAIN
            -e infra_admin_user=$(yq .platform.admin.user config/infrastructure.yaml)
            -e infra_admin_group=$(yq .platform.admin.group config/infrastructure.yaml)
            -e infra_ssh_key_file=/tmp/ssh_key.pub
            -e git_commit=$GIT_COMMIT
            -e git_tag=$GIT_TAG'
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          ADMIN_SSH_PUBLIC_KEY: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}
