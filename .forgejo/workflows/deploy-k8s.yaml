# ===========================================================================
# deploy-k8s.yaml — manual-only k8s deployment workflow.
#
# Unlike enforce-iac.yaml (which provisions VMs + waits for readiness), this
# workflow is a lighter manual tool: triggered on demand via workflow_dispatch
# and intended for pushing configuration to an EXISTING cluster. It skips the
# NATS readiness handshake and the plan/apply loop entirely — it just:
#   1. validates infrastructure.yaml, 2. generates the inventory from
#   Terraform's ansible_inventory output, 3. runs the k8s-cluster playbook.
#
# NOTE: it uses third-party images (python:3.12-alpine, alpine/ansible) and
# installs tools inside the step, so it is self-contained but slower than the
# ci-base image used by enforce-iac.
# ===========================================================================
name: Deploy Kubernetes Cluster

on:
  workflow_dispatch:

jobs:
  k8s:
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Validate Infrastructure YAML
        uses: docker://python:3.12-alpine
        with:
          args: >
            sh -c "apk add -q wget &&
            wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq &&
            chmod 755 /usr/local/bin/yq &&
            yq -V | grep -q mikefarah &&
            pip install -q --root-user-action=ignore check-jsonschema &&
            check-jsonschema --schemafile conf/infrastructure.schema.yaml
            conf/infrastructure.yaml"

      - name: Terraform Init and Generate Inventory
        uses: docker://alpine/ansible:latest
        with:
          args: >
            sh -c "apk add --no-cache -q curl unzip wget &&
            wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq &&
            chmod 755 /usr/local/bin/yq &&
            yq -V | grep -q mikefarah &&
            TF_VERSION=$(yq .platform.terraform.version conf/infrastructure.yaml) &&
            curl -sL https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip -o /tmp/terraform.zip &&
            unzip -oq /tmp/terraform.zip -d /usr/local/bin/ &&
            cd terraform &&
            terraform init -reconfigure &&
            terraform output -json ansible_inventory > ../ansible/inventory.json"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}

      - name: Run K8s Cluster Playbook
        uses: docker://alpine/ansible:latest
        with:
          args: >
            sh -c 'apk add -q wget py3-pip &&
            wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq &&
            chmod 755 /usr/local/bin/yq &&
            yq -V | grep -q mikefarah &&
            pip3 install -q --break-system-packages --root-user-action=ignore hvac &&
            ansible-galaxy collection install
            kubernetes.core community.general ansible.posix
            community.hashi_vault pfrest.pfsense --force &&
            if [ -z "$ADMIN_SSH_PUBLIC_KEY" ]; then echo "ERROR: ADMIN_SSH_PUBLIC_KEY not set" && exit 1; fi &&
            if [ -z "$ANSIBLE_SSH_PRIVATE_KEY" ]; then echo "ERROR: ANSIBLE_SSH_PRIVATE_KEY not set" && exit 1; fi &&
            echo "$ADMIN_SSH_PUBLIC_KEY" > /tmp/ssh_key.pub &&
            echo "$ANSIBLE_SSH_PRIVATE_KEY" > /tmp/ansible_key &&
            chmod 600 /tmp/ansible_key &&
            export ANSIBLE_CONFIG=$PWD/ansible/ansible.cfg &&
            SERVICE_HOST=$(yq .defaults.service_host conf/infrastructure.yaml) &&
            DNS_DOMAIN=$(yq .platform.proxmox.dns_domain conf/infrastructure.yaml) &&
            SERVICE_DOMAIN="${SERVICE_HOST}.${DNS_DOMAIN}" &&
            ansible-playbook -i ansible/inventory.json ansible/playbooks/k8s-cluster.yaml
            --private-key /tmp/ansible_key
            -e infra_platform_kubernetes_version=$(yq .platform.kubernetes.version conf/infrastructure.yaml)
            -e infra_platform_kubernetes_pod_network_cidr=$(yq .platform.kubernetes.pod_network_cidr conf/infrastructure.yaml)
            -e infra_platform_kubernetes_calico_version=$(yq .platform.kubernetes.calico_version conf/infrastructure.yaml)
            -e infra_service_domain=$SERVICE_DOMAIN
            -e infra_admin_user=$(yq .platform.admin.user conf/infrastructure.yaml)
            -e infra_admin_group=$(yq .platform.admin.group conf/infrastructure.yaml)
            -e infra_ssh_key_file=/tmp/ssh_key.pub'
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          ADMIN_SSH_PUBLIC_KEY: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}
