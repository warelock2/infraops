# ===========================================================================
# Example infrastructure.yaml — template for a fresh environment.
#
# Copy this file to infrastructure.yaml and customize for your setup. Every
# key here mirrors the real file (conf/infrastructure.yaml); the values are
# placeholders. If you add a field to one, add it to both — the schema
# (conf/infrastructure.schema.yaml) validates the real file against the
# same field rules that drive Terraform + Ansible.
# ===========================================================================

name: my-infrastructure

# ---------------------------------------------------------------------------
# tools — every tool version pinned for reproducible builds, grouped in one
# place. The real file pins exact versions (see conf/infrastructure.yaml);
# the schema validates version patterns and the "latest" keyword.
# ---------------------------------------------------------------------------
tools:
  kubernetes: "1.33.0"
  kubectl: "1.33.0"
  calico: "v3.29.2"
  terraform: "1.7.5"
  vault_cli: "1.17.3"
  nats_cli: "0.4.0"
  ansible_core: "2.21.2"
  ansible_collections:
    community_general: "13.2.0"
    community_hashi_vault: "7.1.0"
    ansible_posix: "2.2.2"
    kubernetes_core: "6.5.0"
    pfrest_pfsense: "0.0.13"
  alpine: "3.24.1"
  hvac: "2.4.0"
  pfsense_vshell: "2.2.4"
  check_jsonschema: "0.37.4"
  yq: "4.53.3"

# ---------------------------------------------------------------------------
# platform — repo-wide defaults: admin user/group, OIDC provider, version
# pins, and the Proxmox node VMs are cloned from.
# ---------------------------------------------------------------------------
platform:
  admin:
    user: myuser
    group: mygroup
  keycloak:
    realm: myproject
    auth_realm: master
    admin_user: admin
    container_image: "forgejo.afobl.com/warelock/keycloak:latest"
  kubernetes:
    pod_network_cidr: "10.244.0.0/16"
    oidc_issuer_url: "https://keycloak.example.com:8443/realms/myproject"
  proxmox:
    node: myproxmox
    template_id: 8000
    dns_servers:
      - "10.0.0.1"
    dns_domain: example.com
    linked_clone: false
    tls_self_signed: true

# ---------------------------------------------------------------------------
# defaults — the fallback VM sizing and network settings every cluster uses
# unless a cluster overrides them. vm applies to STANDALONE hosts and also
# holds the VM ID pool they auto-allocate from; node_vm applies to cluster
# node VMs.
# ---------------------------------------------------------------------------
defaults:
  cluster_type: k8s
  service_type: docker_compose
  service_host: docker
  gateway: "10.0.0.1"
  vm:
    cores: 2
    memory_gb: 2
    disk_gb: 32
    datastore: RAIDZ
    vm_id_start: 9100
    vm_id_end: 9199
  node_vm:
    cores: 2
    memory_gb: 2
    disk_gb: 32
    datastore: RAIDZ
  planes:
    control_plane:
      plane_name: control
    workers:
      plane_name: worker

# ---------------------------------------------------------------------------
# clusters — the k8s clusters Terraform provisions. VM names derive as
# <cluster_type>-<name>-<plane>-<NN>; vm_id_start/end bound the VM ID range.
# ---------------------------------------------------------------------------
clusters:
  - name: mycluster
    enforcement:
      - infrastructure_provisioning
      - configuration_management
    control_plane:
      nodes: 1
      vm_id_start: 9000
      vm_id_end: 9049
      vip: "10.0.0.100"
    workers:
      nodes: 2
      vm_id_start: 9050
      vm_id_end: 9099

# ---------------------------------------------------------------------------
# hosts — standalone (non-cluster) hosts: connection info for Ansible,
# services they run, and the DNS IP pool the IAC DNS workflow manages. Hosts
# with infrastructure_provisioning are built as VMs from defaults.vm (or a
# vm: block override; explicit vm_id wins over range auto-allocation).
# ---------------------------------------------------------------------------
hosts:
  - name: docker
    enforcement:
      - configuration_management
    connection:
      user: ansible

  - name: testvm
    enforcement:
      - infrastructure_provisioning
      - configuration_management
    connection:
      user: ansible

  - name: firewall
    services:
      - dns
      - dhcp
      - gateway
      - firewall
    ip_pool:
      start: "10.0.0.50"
      end: "10.0.0.99"
    enforcement: []
    connection:
      host: 10.0.0.1
      user: ansible

# ---------------------------------------------------------------------------
# services — hosted apps and their exposed ports, used for DNS/port planning.
# ---------------------------------------------------------------------------
services:
  defaults:
    host: docker
  instances:
    keycloak:
      - name: keycloak
        port: 8443
    minio:
      - name: minio
        port: 9000
    vault:
      - name: vault
        port: 8200
